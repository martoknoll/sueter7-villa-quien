<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobre Sueter 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist+Mono:wght@400;700&display=swap">
<style>
:root{
  --papel:#eae5db;
  --tinta:#141414;
  --rojo:#c9452c;
  --amarillo:#e8c340;
  --crema:#fffdf9;
  --display:"Bebas Neue","Haettenschweiler","Arial Narrow",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);overflow-x:hidden;font-family:var(--mono)}
.stage{display:flex;justify-content:center;align-items:flex-start}

.screen{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;
  transform-origin:top center;background:var(--papel)}
.fondo{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none}

/* zonas que se pueden apretar, encima de la imagen */
.zona{position:absolute;display:block;cursor:pointer;z-index:4;
  border:2.5px solid transparent;transition:border-color .14s}
.zona:hover,.zona:focus-visible{border-color:var(--tinta);outline:none}

.btn-discos{position:absolute;left:168px;top:891px;width:411px;height:34px;z-index:4;
  display:block;cursor:pointer;transition:transform .1s}
.btn-discos:hover{transform:translate(-1px,-1px)}
.btn-discos:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}

.pronto{position:absolute;z-index:8;background:var(--rojo);color:var(--crema);
  font-size:14px;font-weight:700;letter-spacing:.16em;padding:7px 13px;border:2.5px solid var(--tinta);
  transform:rotate(-6deg) scale(.7);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.pronto.on{opacity:1;transform:rotate(-6deg) scale(1)}
.fundido{position:absolute;inset:0;background:var(--papel);opacity:0;pointer-events:none;
  transition:opacity .4s linear;z-index:9}
.fundido.on{opacity:1}

@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
/* acceso a "Tu versión" junto a la navegación que trae el diseño */
.nav-tv{position:absolute;z-index:7;height:44px;width:134px;display:grid;place-items:center;
  font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:20px;letter-spacing:.09em;text-transform:uppercase;line-height:1;padding-top:3px;
  background:#c9452c;color:#fffdf9;text-decoration:none;border:2px solid #141414;box-shadow:3px 3px 0 #141414}
.nav-tv:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #141414}
</style>
<script src="puente.js?v=20261029a"></script>
</head>
<body>
<div class="stage">
  <div class="screen" id="screen">
    <img class="fondo" src="sobre-fondo.jpg"
         alt="Sobre Sueter 7: proyecto personal que nace en la rutina, entre cuadernos, caminatas y canciones.">

    <!-- navegación: va encima de los botones que ya están en el diseño -->
    <a class="zona" href="index.html"   style="left:1220px;top:22px;width:88px;height:44px"  aria-label="Inicio"></a>
    <a class="zona" href="sueter7.html" style="left:1330px;top:22px;width:111px;height:44px" aria-label="Sueter 7" aria-current="page"></a>
    <a class="zona" href="diario.html"  style="left:1463px;top:22px;width:92px;height:44px"  aria-label="Diario"></a>
    <a class="zona" href="discos.html"  style="left:1577px;top:22px;width:95px;height:44px"  aria-label="Discos"></a>
    <a class="zona" href="tienda.html"  style="left:1694px;top:22px;width:96px;height:44px"  aria-label="Tienda"></a>
    <a class="zona" href="fechas.html"  style="left:1812px;top:22px;width:98px;height:44px"  aria-label="Fechas"></a>
    <a class="nav-tv" href="tu-version/" style="left:1072px;top:22px">Tu versión</a>

    <a class="btn-discos" href="discos.html" aria-label="Ir a Discos"></a>

    <div class="pronto" id="pronto">PRONTO</div>
    <div class="fundido" id="fundido"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const dormir = ms => new Promise(r=>setTimeout(r, ms));
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

function fit(){
  const s=$("screen"), stage=s.parentElement;
  const k=Math.min(stage.parentElement.clientWidth/1920, innerHeight/1080);
  s.style.transform="scale("+k+")";
  stage.style.height=(1080*k)+"px";
}
window.addEventListener("resize", fit); fit();

/* si la página todavía no existe, avisa en vez de tirar 404 */
let yendo=false;
async function existe(url){
  try{ const r=await fetch(url,{method:"HEAD"}); return r.ok; }catch(e){ return false; }
}
document.querySelectorAll("a[href$='.html']").forEach(a=>{
  a.addEventListener("click", async ev=>{
    ev.preventDefault();
    if(yendo) return;
    const destino=a.getAttribute("href");
    if(destino==="sueter7.html") return;
    yendo=true;
    if(await existe(destino)){
      $("fundido").classList.add("on");
      await dormir(quieto?0:380);
      location.href=destino;
      return;
    }
    const r=a.getBoundingClientRect(), s=$("screen").getBoundingClientRect(), k=s.width/1920;
    const sello=$("pronto");
    sello.style.left=((r.left-s.left)/k + a.offsetWidth/2 - 48)+"px";
    sello.style.top =((r.top -s.top )/k + a.offsetHeight + 12)+"px";
    sello.classList.add("on");
    await dormir(1100);
    sello.classList.remove("on");
    yendo=false;
  });
});
</script>
</body>
</html>
