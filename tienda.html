<!doctype html>
<html lang="es" data-sin-escape>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda — sueter7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist+Mono:wght@400;700&display=swap">
<style>
:root{
  --papel:#eae5db;
  --crema:#efe9de;
  --tinta:#141414;
  --gris:#4a4a4a;
  --rojo:#c9452c;
  --amarillo:#e8c340;
  --azul:#2c61b2;
  --display:"Bebas Neue","Haettenschweiler","Arial Narrow",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);overflow-x:hidden;font-family:var(--mono)}
.stage{position:relative;display:flex;justify-content:center;align-items:flex-start;
  background:#b8cbe4 url("tienda-fondo-ancho.jpg") center top/auto 100% no-repeat}

.screen{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;
  transform-origin:top center;background:var(--papel)}
.fondo{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none}

/* navegación: encima de los botones que ya trae el diseño */
.zona{position:absolute;display:block;cursor:pointer;z-index:6;
  border:2.5px solid transparent;transition:border-color .14s}
.zona:hover,.zona:focus-visible{border-color:var(--tinta);outline:none}

/* ===== tarjetas de producto ===== */
.prod{position:absolute;top:265px;width:364px;height:550px;background:var(--crema);
  border:2.5px solid var(--tinta);box-shadow:10px 10px 0 var(--tinta);z-index:5}
.prod .foto{position:absolute;left:30px;top:40px;width:304px;height:266px;
  display:grid;place-items:center}
.prod .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
/* el contenido de la tarjeta cambia con un fundido cuando se usan las flechas */
.prod .cont{position:absolute;inset:0;transition:opacity .22s ease,transform .22s ease}
.prod.cambiando .cont{opacity:0;transform:translateY(8px)}
.prod.marcado{animation:marcar 1.1s ease 2}
@keyframes marcar{0%,100%{box-shadow:10px 10px 0 var(--tinta)}50%{box-shadow:10px 10px 0 var(--tinta),0 0 0 8px var(--amarillo)}}

/* ===== volver y título de sección (sistema: Bebas en amarillo + pixelada en negro, bordes comidos) ===== */
@font-face{font-family:"PP NeueBit";src:local("PP NeueBit Bold"),local("PPNeueBit-Bold"),url("tu-version/fonts/PPNeueBit-Bold.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Tiny5";src:url("tu-version/fonts/tiny5-latin.woff2") format("woff2");font-display:swap}
.volver{position:absolute;left:74px;top:52px;z-index:7;display:flex;align-items:center;gap:12px;text-decoration:none;
  font-family:var(--display);font-size:24px;letter-spacing:.08em;color:var(--tinta);
  background:var(--crema);padding:8px 14px 5px;border:2px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta)}
.volver:hover{color:var(--rojo)}
.t-tienda,.t-merch{position:absolute;z-index:5;display:grid;place-items:center}
.t-tienda{left:176px;top:118px;width:360px;height:112px;transform:rotate(-2.2deg)}
.t-merch{left:552px;top:146px;width:250px;height:72px;transform:rotate(-1.2deg)}
.t-tienda::before,.t-merch::before{content:"";position:absolute;inset:-5px;z-index:-1;filter:url(#comido)}
.t-tienda::before{background:var(--amarillo);box-shadow:12px 12px 0 var(--tinta)}
.t-merch::before{background:#0b0b0b}
.t-tienda span{position:relative;font-family:var(--display);font-size:112px;line-height:.8;letter-spacing:.03em;color:var(--tinta);padding-top:10px}
.t-merch span{position:relative;font-family:"PP NeueBit","Tiny5",monospace;font-size:40px;line-height:1;color:var(--crema);text-transform:uppercase}

/* ===== flechas del carrusel ===== */
.flecha{position:absolute;top:494px;width:92px;height:92px;z-index:6;display:grid;place-items:center;cursor:pointer;
  background:var(--crema);border:3px solid var(--tinta);border-radius:50%;box-shadow:6px 6px 0 var(--tinta);
  padding:0;color:#d24426;transition:transform .12s,background .12s}
.flecha svg{display:block;width:56px;height:30px}
.flecha:hover{background:var(--amarillo)}
.flecha.izq{left:58px}
.flecha.der{left:1764px}
.flecha:hover{transform:scale(1.12)}
.flecha.izq:hover{transform:translateX(-6px) scale(1.12)}
.flecha.der:hover{transform:translateX(6px) scale(1.12)}
.flecha:active{transform:scale(.94)}
.flecha:focus-visible{outline:3px solid #141414;outline-offset:2px}
.puntos{position:absolute;left:173px;width:1534px;top:858px;z-index:6;display:flex;justify-content:center;gap:12px}
.puntos button{width:16px;height:16px;padding:0;border-radius:50%;border:2.5px solid var(--tinta);background:var(--crema);cursor:pointer}
.puntos button.on{background:var(--rojo)}

/* ===== botón "Leer descripción" y ficha del producto ===== */
.prod .leer{position:absolute;left:28px;right:28px;top:510px;height:28px;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--tinta);
  text-decoration:underline;text-underline-offset:4px}
.prod .leer:hover{color:var(--rojo)}
.ficha{position:absolute;left:50%;top:150px;width:1120px;height:700px;z-index:14;background:var(--crema);border:3px solid var(--tinta);
  box-shadow:14px 14px 0 var(--tinta);display:grid;grid-template-columns:520px 1fr;transform:translate(-50%,24px);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .24s cubic-bezier(.3,1.3,.6,1)}
.ficha.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.ficha .foto-g{border-right:3px solid var(--tinta);display:grid;place-items:center;padding:40px;background:var(--crema)}
.ficha .foto-g img{max-width:100%;max-height:600px;object-fit:contain}
.ficha .info{position:relative;padding:56px 56px 40px;display:flex;flex-direction:column}
.ficha .cerrar-f{position:absolute;right:18px;top:14px;background:none;border:0;font-size:30px;cursor:pointer}
.ficha .tipo-f{font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
.ficha h3{font-family:var(--display);font-size:66px;line-height:.95;letter-spacing:.02em;margin:10px 0 14px}
.ficha .precio-f{font-family:var(--display);font-size:44px;color:var(--rojo);margin-bottom:22px}
.ficha .desc-f{font-size:20px;line-height:1.6;color:var(--tinta);margin:0 0 18px}
.ficha .talles-f{font-size:17px;color:var(--gris);margin-bottom:auto}
.ficha .talles-f span{font-size:14px}
.ficha .comprar-f{height:64px;margin-top:24px;background:var(--amarillo);border:3px solid var(--tinta);box-shadow:7px 7px 0 var(--tinta);
  font-family:var(--display);font-size:32px;letter-spacing:.1em;cursor:pointer;padding-top:5px;transition:transform .1s,box-shadow .1s}
.ficha .comprar-f:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--tinta)}

/* ===== finalizar compra: datos, resumen y confirmación ===== */
.checkout{position:absolute;left:50%;top:120px;width:760px;z-index:14;background:var(--crema);border:3px solid var(--tinta);
  box-shadow:14px 14px 0 var(--tinta);transform:translate(-50%,24px);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .24s cubic-bezier(.3,1.3,.6,1)}
.checkout.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.checkout .cab{display:flex;justify-content:space-between;align-items:center;background:var(--amarillo);border-bottom:3px solid var(--tinta);
  padding:14px 24px 9px;font-family:var(--display);font-size:36px;letter-spacing:.06em}
.checkout .cab button{background:none;border:0;font-size:24px;cursor:pointer}
.checkout .cuerpo{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;padding:26px 28px 30px}
.checkout label{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
.checkout input,.checkout select{width:100%;height:46px;border:2.5px solid var(--tinta);background:#fffdf9;padding:0 12px;
  font-family:var(--mono);font-size:16px;margin-bottom:16px;box-sizing:border-box}
.checkout .entrega{display:flex;gap:10px;margin-bottom:16px}
.checkout .entrega label{flex:1;display:flex;align-items:center;gap:8px;border:2.5px solid var(--tinta);padding:10px 12px;cursor:pointer;
  text-transform:none;letter-spacing:.02em;font-size:15px;margin:0;background:#fffdf9}
.checkout .entrega input{width:auto;height:auto;margin:0}
.checkout .resumen{border:2.5px dashed rgba(20,20,20,.5);padding:16px 18px;font-size:15px;align-self:start}
.checkout .resumen h4{margin:0 0 10px;font-family:var(--display);font-size:26px;letter-spacing:.05em}
.checkout .resumen .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.checkout [hidden]{display:none !important}
.checkout .resumen .tot{border-top:2px solid var(--tinta);margin-top:8px;padding-top:10px;font-weight:700;font-size:18px}
.checkout .pagar{grid-column:1/-1;height:58px;background:var(--amarillo);border:2.5px solid var(--tinta);box-shadow:6px 6px 0 var(--tinta);
  font-family:var(--display);font-size:28px;letter-spacing:.08em;cursor:pointer;padding-top:4px}
.checkout .pagar:disabled{opacity:.6;cursor:default}
.checkout .error{grid-column:1/-1;color:var(--rojo);font-size:14px;margin:-12px 0 0;min-height:18px}
.checkout .listo{grid-column:1/-1;text-align:center;padding:10px 0}
.checkout .listo h3{font-family:var(--display);font-size:46px;margin:0 0 6px;letter-spacing:.03em}
.checkout .listo .codigo{display:inline-block;margin:16px 0;padding:12px 26px;border:3px dashed var(--tinta);font-family:var(--display);font-size:42px;letter-spacing:.12em}
.checkout .listo p{font-size:15px;line-height:1.6;color:var(--gris);margin:6px 0}

/* ===== aviso al sumar al carrito ===== */
.sumado{position:absolute;left:50%;top:300px;width:520px;z-index:12;background:var(--crema);border:3px solid var(--tinta);
  box-shadow:12px 12px 0 var(--tinta);transform:translate(-50%,24px) rotate(-1deg);opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s cubic-bezier(.3,1.4,.6,1)}
.sumado.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) rotate(-1deg)}
.sumado .cab{display:flex;align-items:center;justify-content:space-between;background:var(--amarillo);border-bottom:3px solid var(--tinta);
  padding:12px 18px 8px;font-family:var(--display);font-size:30px;letter-spacing:.06em}
.sumado .cab button{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--tinta);padding:2px 6px}
.sumado .cuerpo{display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:center;padding:22px 24px 10px}
.sumado .cuerpo .mini{width:110px;height:110px;border:2.5px solid var(--tinta);background:var(--crema);display:grid;place-items:center}
.sumado .cuerpo .mini img{max-width:88%;max-height:88%}
.sumado .nom{font-family:var(--display);font-size:32px;line-height:1;letter-spacing:.02em}
.sumado .sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin-top:6px}
.sumado .pre{font-size:18px;font-weight:700;margin-top:10px}
.sumado .acciones{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px 24px}
.sumado .acciones button{height:50px;font-family:var(--display);font-size:22px;letter-spacing:.08em;padding-top:3px;cursor:pointer;
  border:2.5px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta);background:var(--crema);color:var(--tinta);transition:transform .1s}
.sumado .acciones button.prin{background:var(--amarillo)}
.sumado .acciones button:hover{transform:translate(-1px,-1px)}
.sumado .total-mini{padding:0 24px;font-size:13px;color:var(--gris);letter-spacing:.04em}
.prod .tipo{position:absolute;left:0;right:0;top:318px;text-align:center;
  font-size:12px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--gris)}
.prod h2{position:absolute;left:14px;right:14px;top:344px;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--display);font-size:38px;line-height:1;letter-spacing:.02em;color:var(--tinta)}
.prod .precio{position:absolute;left:0;right:0;top:410px;text-align:center;
  font-size:17px;letter-spacing:.04em;color:var(--tinta)}
/* el botón ocupa el mismo ancho que la caja de textos de la tarjeta */
.prod .comprar{position:absolute;left:28px;right:28px;top:452px;width:auto;height:50px;
  display:grid;place-items:center;text-decoration:none;cursor:pointer;
  font-family:var(--display);font-size:24px;letter-spacing:.1em;color:var(--tinta);padding-top:2px;
  border:2px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta);
  background:var(--amarillo);transition:transform .1s,box-shadow .1s}
.prod .comprar:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--tinta)}
.prod .comprar:focus-visible{outline:2px solid var(--rojo);outline-offset:3px}

.pronto{position:absolute;z-index:8;background:var(--rojo);color:#fffdf9;
  font-size:14px;font-weight:700;letter-spacing:.16em;padding:7px 13px;border:2.5px solid var(--tinta);
  transform:rotate(-6deg) scale(.7);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.pronto.on{opacity:1;transform:rotate(-6deg) scale(1)}
.fundido{position:absolute;inset:0;background:var(--papel);opacity:0;pointer-events:none;
  transition:opacity .4s linear;z-index:9}
.fundido.on{opacity:1}

@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
/* ===== carrito ===== */
.chip{position:absolute;left:846px;top:39px;height:44px;z-index:7;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:var(--crema);color:var(--tinta);border:2px solid var(--tinta);
  box-shadow:3px 3px 0 var(--tinta);cursor:pointer;font-family:var(--display);font-size:20px;
  letter-spacing:.09em;padding-top:3px;transition:transform .1s,box-shadow .1s}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--tinta)}
.chip.suma{background:var(--amarillo)}
.chip .n{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0;
  min-width:22px;height:22px;border-radius:50%;background:var(--rojo);color:#fffdf9;
  display:grid;place-items:center;padding-top:1px}
.chip .n[data-cero="1"]{background:var(--tinta)}

.velo{position:absolute;inset:0;background:rgba(10,10,12,.5);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:10}
.velo.on{opacity:1;pointer-events:auto}
/* el mismo velo sobre los costados, para que el oscurecido llegue a todo el ancho */
.velo-costados{position:absolute;inset:0;background:rgba(10,10,12,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.velo-costados.on{opacity:1}

.panel{position:absolute;right:0;top:0;bottom:0;width:470px;background:var(--crema);
  border-left:3px solid var(--tinta);z-index:11;transform:translateX(102%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.panel.on{transform:translateX(0)}
.panel header{display:flex;align-items:center;justify-content:space-between;
  padding:30px 32px 18px;border-bottom:2.5px solid var(--tinta)}
.panel header h2{margin:0;font-family:var(--display);font-size:38px;letter-spacing:.04em}
.panel .cerrar{background:transparent;border:0;cursor:pointer;font-family:var(--mono);font-size:22px;
  line-height:1;color:var(--tinta);padding:6px 8px}
.panel .cerrar:hover{color:var(--rojo)}
.items{flex:1;overflow:auto;padding:12px 32px}
.item{display:grid;grid-template-columns:66px 1fr auto;gap:16px;align-items:center;
  padding:16px 0;border-bottom:1px solid rgba(20,20,20,.18)}
.item .mini{width:66px;height:66px;border:2px solid var(--tinta);background:var(--crema);display:grid;place-items:center}
.item .mini img{max-width:88%;max-height:88%;display:block}
.item .nom{font-family:var(--display);font-size:24px;line-height:1;letter-spacing:.02em}
.item .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin-top:4px}
.item .uni{font-size:13px;color:var(--gris);margin-top:6px}
.cant{display:flex;align-items:center;gap:0;margin-top:9px;width:max-content;
  border:2px solid var(--tinta);background:#fffdf9}
.cant button{width:26px;height:26px;border:0;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:15px;font-weight:700;color:var(--tinta);line-height:1}
.cant button:hover{background:var(--amarillo)}
.cant span{min-width:30px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:700}
.item .quitar{background:transparent;border:0;cursor:pointer;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gris);text-decoration:underline;padding:0;margin-top:8px}
.item .quitar:hover{color:var(--rojo)}
.item .sum{font-family:var(--mono);font-size:16px;font-weight:700;white-space:nowrap}
.vacioc{padding:60px 32px;text-align:center;color:var(--gris);font-size:14px;line-height:1.7}
.vacioc b{display:block;font-family:var(--display);font-size:26px;color:var(--tinta);
  letter-spacing:.04em;margin-bottom:8px}
.panel footer{padding:22px 32px 30px;border-top:2.5px solid var(--tinta)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.total span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.total b{font-family:var(--display);font-size:34px;letter-spacing:.03em}
.finalizar{width:100%;height:52px;display:grid;place-items:center;background:var(--amarillo);
  color:var(--tinta);border:2.5px solid var(--tinta);box-shadow:6px 6px 0 var(--tinta);cursor:pointer;
  font-family:var(--display);font-size:24px;letter-spacing:.09em;padding-top:3px;
  transition:transform .1s,box-shadow .1s}
.finalizar:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--tinta)}
.finalizar:disabled{opacity:.42;cursor:default;transform:none;box-shadow:6px 6px 0 var(--tinta)}
.aclara{margin:12px 0 0;font-size:11.5px;line-height:1.6;color:var(--gris);text-align:center}

/* acceso a "Tu versión" junto a la navegación que trae el diseño */
.nav-tv{position:absolute;z-index:7;height:44px;width:134px;display:grid;place-items:center;
  font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:20px;letter-spacing:.09em;text-transform:uppercase;line-height:1;padding-top:3px;
  background:#c9452c;color:#fffdf9;text-decoration:none;border:2px solid #141414;box-shadow:3px 3px 0 #141414}
.nav-tv:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #141414}
</style>
<script src="puente.js?v=20261102e"></script>
<script src="productos.js?v=20261102e"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="comido" x="-5%" y="-12%" width="110%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="5" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="stage">
  <div class="velo-costados" id="velo2"></div>
  <div class="screen" id="screen">
    <img class="fondo" src="tienda-fondo.jpg" alt="Tienda de sueter7 sobre un fondo de medios tonos azul">

    <a class="zona" href="index.html"   style="left:1210px;top:36px;width:88px;height:44px"  aria-label="Inicio"></a>
    <a class="zona" href="sueter7.html" style="left:1320px;top:36px;width:111px;height:44px" aria-label="Sueter 7"></a>
    <a class="zona" href="diario.html"  style="left:1453px;top:36px;width:92px;height:44px"  aria-label="Diario"></a>

    <a class="zona" href="fechas.html"  style="left:1802px;top:36px;width:98px;height:44px"  aria-label="Fechas"></a>

    <a class="volver" href="index.html">
      <svg width="48" height="22" viewBox="0 0 72 32" fill="none" aria-hidden="true"><path d="M70 16H7M20 5L6 16l14 11" stroke="#c9452c" stroke-width="5" stroke-linecap="square"/></svg>
      Volver al andén
    </a>
    <div class="t-tienda"><span>TIENDA</span></div>
    <div class="t-merch"><span>Merch</span></div>
    <div id="productos"></div>
    <button class="flecha izq" id="ant" aria-label="Productos anteriores">
      <svg width="86" height="44" viewBox="0 0 86 44" fill="none" aria-hidden="true"><path d="M84 22H8M26 4L6 22l20 18" stroke="currentColor" stroke-width="7" stroke-linecap="square"/></svg>
    </button>
    <button class="flecha der" id="sig" aria-label="Más productos">
      <svg width="86" height="44" viewBox="0 0 86 44" fill="none" aria-hidden="true"><path d="M2 22h76M60 4l20 18-20 18" stroke="currentColor" stroke-width="7" stroke-linecap="square"/></svg>
    </button>
    <div class="puntos" id="puntos"></div>

    <div class="sumado" id="sumado" role="dialog" aria-label="Producto sumado al carrito" aria-hidden="true">
      <div class="cab"><span>¡Sumado al carrito!</span><button id="sumado-x" aria-label="Cerrar">✕</button></div>
      <div class="cuerpo"><div class="mini"><img id="sumado-img" src="" alt=""></div>
        <div><div class="nom" id="sumado-nom"></div><div class="sub" id="sumado-tipo"></div><div class="pre" id="sumado-pre"></div></div></div>
      <div class="total-mini" id="sumado-total"></div>
      <div class="acciones"><button id="seguir">Seguir mirando</button><button class="prin" id="ver-carrito">Ver carrito</button></div>
    </div>


    <button class="chip" id="chip" aria-label="Abrir el carrito">Carrito <i class="n" id="chip-n" data-cero="1">0</i></button>

    <div class="velo" id="velo"></div>
    <aside class="panel" id="panel" aria-hidden="true" aria-label="Carrito">
      <header>
        <h2>Tu carrito</h2>
        <button class="cerrar" id="cerrar" aria-label="Cerrar el carrito">✕</button>
      </header>
      <div class="items" id="items"></div>
      <footer>
        <div class="total"><span>Total</span><b id="total">$0</b></div>
        <button class="finalizar" id="finalizar" disabled>Finalizar compra</button>
        <p class="aclara" id="aclara">Seguís a la pantalla de compra: tus datos, la entrega y el pago con Mercado Pago.</p>
      </footer>
    </aside>

    <div class="ficha" id="ficha" role="dialog" aria-label="Descripción del producto" aria-hidden="true">
      <div class="foto-g"><img id="fi-img" src="" alt=""></div>
      <div class="info">
        <button class="cerrar-f" id="fi-cerrar" aria-label="Cerrar">✕</button>
        <span class="tipo-f" id="fi-tipo"></span>
        <h3 id="fi-nombre"></h3>
        <div class="precio-f" id="fi-precio"></div>
        <p class="desc-f" id="fi-desc"></p>
        <div class="talles-f" id="fi-talles"></div>
        <button class="comprar-f" id="fi-comprar">Agregar al carrito</button>
      </div>
    </div>
    <div class="checkout" id="checkout" role="dialog" aria-label="Finalizar compra" aria-hidden="true">
      <div class="cab"><span>Finalizar compra</span><button id="co-cerrar" aria-label="Cerrar">✕</button></div>
      <form class="cuerpo" id="co-form" novalidate></form>
    </div>
    <div class="pronto" id="pronto">PRONTO</div>
    <div class="fundido" id="fundido"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const dormir = ms => new Promise(r=>setTimeout(r,ms));
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ==========================================================
   LOS PRODUCTOS — editá acá.
   link: pegá la URL de venta. Vacío = el botón avisa PRONTO.
   ========================================================== */
/* los productos (con sus descripciones) están en productos.js */
const PRODUCTOS = window.S7_PRODUCTOS;
const API = window.S7_API_CHECKOUT;

const plata = n => "$" + n.toLocaleString("es-AR");

const X0 = 173, PASO = 390, VISIBLES = 4;   /* dónde arranca la primera, cada cuánto va la siguiente, cuántas se ven */
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ==========================================================
   EL CARRUSEL — siempre hay 4 tarjetas en pantalla; las flechas
   corren los productos de a uno (y dan la vuelta al llegar al final)
   ========================================================== */
let ini = 0;
$("productos").innerHTML = Array.from({length:VISIBLES}, (_,i)=>`
  <article class="prod" style="left:${X0 + i*PASO}px"><div class="cont"></div></article>`).join("");
const tarjetas = [...document.querySelectorAll(".prod")];
function contenido(p, i){
  return `<div class="foto"><img src="${esc(p.img)}" alt="${esc(p.tipo)} ${esc(p.nombre)}"></div>
    <div class="tipo">${esc(p.tipo)}</div>
    <h2>${esc(p.nombre)}</h2>
    <div class="precio">${plata(p.precio)}</div>
    <button class="comprar" data-i="${i}">Comprar</button>
    <button class="leer" data-i="${i}">Leer descripción</button>`;
}
function pintarProductos(animar){
  tarjetas.forEach((t,k)=>{
    const i = (ini + k) % PRODUCTOS.length;
    const poner = ()=>{ t.querySelector(".cont").innerHTML = contenido(PRODUCTOS[i], i); t.dataset.id = PRODUCTOS[i].id; };
    if(!animar || quieto){ poner(); return; }
    t.classList.add("cambiando");
    setTimeout(()=>{ poner(); t.classList.remove("cambiando"); }, 200 + k*45);
  });
  const total = PRODUCTOS.length;
  $("puntos").innerHTML = PRODUCTOS.map((p,i)=>`<button class="${i===ini?"on":""}" data-ir="${i}" aria-label="Ver desde ${esc(p.tipo)}"></button>`).join("");
  const hay = total > VISIBLES;
  $("ant").hidden = $("sig").hidden = $("puntos").hidden = !hay;
}
function mover(d){ ini = (ini + d + PRODUCTOS.length) % PRODUCTOS.length; pintarProductos(true); }
$("ant").addEventListener("click", ()=>mover(-1));
$("sig").addEventListener("click", ()=>mover(1));
$("puntos").addEventListener("click", ev=>{ const b=ev.target.closest("button"); if(b){ ini=+b.dataset.ir; pintarProductos(true); } });
document.addEventListener("keydown", ev=>{
  if($("panel").classList.contains("on") || $("sumado").classList.contains("on") || $("checkout").classList.contains("on") || $("ficha").classList.contains("on")) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
  if(ev.key==="ArrowRight") mover(1);
  if(ev.key==="ArrowLeft") mover(-1);
});
$("productos").addEventListener("click", ev=>{
  const b = ev.target.closest(".comprar"); if(!b) return;
  agregar(PRODUCTOS[+b.dataset.i].id);
});
pintarProductos(false);

/* llegar con ?producto=vinilo (por ejemplo desde "Comprar vinilo" en Discos) lo muestra y lo marca */
(function(){
  const q = new URLSearchParams(location.search);
  const sumar = q.get("agregar");                 /* "Comprar vinilo" de Discos: lo suma directo al carrito */
  const id = sumar || q.get("producto");
  const i = PRODUCTOS.findIndex(p=>p.id===id);
  if(i<0) return;
  if(sumar){
    /* que no se vuelva a sumar si se recarga la página */
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
    setTimeout(()=>agregar(id), 450);
  }
  if(i >= VISIBLES) ini = Math.min(i, PRODUCTOS.length - VISIBLES);
  pintarProductos(false);
  const t = tarjetas.find(t=>t.dataset.id===id);
  if(t) setTimeout(()=>t.classList.add("marcado"), 400);
})();

/* ==========================================================
   EL CARRITO
   Guarda lo que agregaste en el navegador, así no se pierde
   si recargás o te vas a otra página y volvés.
   ========================================================== */
const LLAVE = "s7-carrito";
let carrito = {};
try{ carrito = JSON.parse(localStorage.getItem(LLAVE) || "{}") || {}; }catch(e){ carrito = {}; }

function guardar(){
  try{ localStorage.setItem(LLAVE, JSON.stringify(carrito)); }catch(e){}
}
function unidades(){ return Object.values(carrito).reduce((a,b)=>a+b, 0); }
function totalPesos(){
  return Object.entries(carrito).reduce((a,[id,c])=>{
    const p = PRODUCTOS.find(x=>x.id===id);
    return a + (p ? p.precio*c : 0);
  }, 0);
}
function agregar(id){
  carrito[id] = (carrito[id]||0) + 1;
  guardar(); pintarCarrito(); latir(); avisoSumado(id);
}
/* el aviso que aparece al sumar un producto */
function avisoSumado(id){
  const p = PRODUCTOS.find(x=>x.id===id); if(!p) return;
  $("sumado-img").src = p.img; $("sumado-img").alt = p.tipo;
  $("sumado-nom").textContent = p.nombre; $("sumado-tipo").textContent = p.tipo;
  $("sumado-pre").textContent = plata(p.precio);
  const u = unidades();
  $("sumado-total").textContent = `En tu carrito: ${u} ${u===1?"producto":"productos"} · ${plata(totalPesos())}`;
  $("sumado").classList.add("on"); $("sumado").setAttribute("aria-hidden","false");
  $("velo").classList.add("on"); $("velo2").classList.add("on");
  setTimeout(()=>$("ver-carrito").focus(), 60);
}
function cerrarSumado(){
  $("sumado").classList.remove("on"); $("sumado").setAttribute("aria-hidden","true");
  if(!$("panel").classList.contains("on")){ $("velo").classList.remove("on"); $("velo2").classList.remove("on"); }
}
function cambiar(id, d){
  carrito[id] = (carrito[id]||0) + d;
  if(carrito[id] <= 0) delete carrito[id];
  guardar(); pintarCarrito();
}
function quitar(id){ delete carrito[id]; guardar(); pintarCarrito(); }

function latir(){
  const chip = $("chip");
  $("chip-n").animate([{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}], {duration:340});
  chip.classList.add("suma");
  clearTimeout(chip._t);
  chip._t = setTimeout(()=> chip.classList.remove("suma"), 420);
}

function pintarCarrito(){
  const u = unidades();
  $("chip-n").textContent = u;
  $("chip-n").dataset.cero = u ? "0" : "1";
  const cajon = $("items");
  if(!u){
    cajon.innerHTML = `<div class="vacioc"><b>Está vacío</b>
      Elegí algo de la tienda y va a aparecer acá.</div>`;
  }else{
    cajon.innerHTML = Object.entries(carrito).map(([id,c])=>{
      const p = PRODUCTOS.find(x=>x.id===id);
      if(!p) return "";
      return `<div class="item">
        <div class="mini"><img src="${esc(p.img)}" alt=""></div>
        <div>
          <div class="nom">${esc(p.nombre)}</div>
          <div class="sub">${esc(p.tipo)}</div>
          <div class="uni">${plata(p.precio)} c/u</div>
          <div class="cant">
            <button data-menos="${esc(id)}" aria-label="Uno menos">−</button>
            <span>${c}</span>
            <button data-mas="${esc(id)}" aria-label="Uno más">+</button>
          </div>
          <button class="quitar" data-quitar="${esc(id)}">Quitar</button>
        </div>
        <div class="sum">${plata(p.precio*c)}</div>
      </div>`;
    }).join("");
  }
  $("total").textContent = plata(totalPesos());
  $("finalizar").disabled = !u;
}

$("items").addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  if(b.dataset.mas)    cambiar(b.dataset.mas, +1);
  if(b.dataset.menos)  cambiar(b.dataset.menos, -1);
  if(b.dataset.quitar) quitar(b.dataset.quitar);
});

function abrir(v){
  $("panel").classList.toggle("on", v);
  $("velo").classList.toggle("on", v); $("velo2").classList.toggle("on", v);
  $("panel").setAttribute("aria-hidden", String(!v));
  if(v) $("cerrar").focus();
}
$("chip").addEventListener("click", ()=>abrir(true));
$("cerrar").addEventListener("click", ()=>abrir(false));
$("velo").addEventListener("click", ()=>{ cerrarSumado(); abrir(false); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ cerrarSumado(); abrir(false); } });
$("sumado-x").addEventListener("click", cerrarSumado);
$("seguir").addEventListener("click", cerrarSumado);
$("ver-carrito").addEventListener("click", ()=>{ cerrarSumado(); abrir(true); });

/* ==========================================================
   FINALIZAR — le pide a nuestra función que arme el checkout
   de Mercado Pago y manda al comprador para allá.

   Al servidor sólo le mandamos QUÉ y CUÁNTO, nunca el precio:
   el precio lo pone la función. Así nadie puede editarlo desde
   el navegador y comprar más barato.
   ========================================================== */
function avisar(texto, ms){
  const sello = $("pronto");
  sello.textContent = texto;
  sello.style.left = "1330px"; sello.style.top = "880px";
  sello.classList.add("on");
  clearTimeout(sello._t);
  sello._t = setTimeout(()=>{ sello.classList.remove("on"); sello.textContent = "PRONTO"; }, ms || 2200);
}

/* Finalizar compra lleva a su propia sección, a pantalla completa (checkout.html) */
$("finalizar").addEventListener("click", ()=>{
  if(!unidades()) return;
  guardar();
  if(window.S7 && S7.alPadre) S7.alPadre({s7:"ir", a:"checkout", q:""});
  else location.href = "checkout.html";
});

/* ==========================================================
   DESCRIPCIÓN DE CADA PRODUCTO — "Leer descripción" abre la ficha
   ========================================================== */
function abrirFicha(i){
  const p = PRODUCTOS[i];
  $("fi-img").src = p.img; $("fi-img").alt = p.tipo+" "+p.nombre;
  $("fi-tipo").textContent = p.tipo; $("fi-nombre").textContent = p.nombre;
  $("fi-precio").textContent = plata(p.precio); $("fi-desc").textContent = p.desc || "";
  $("fi-talles").innerHTML = p.talles ? `<b>Talles:</b> ${p.talles.join(" · ")} <span>(lo elegís al finalizar la compra)</span>` : "";
  $("fi-comprar").dataset.i = i;
  $("ficha").classList.add("on"); $("ficha").setAttribute("aria-hidden","false");
  $("velo").classList.add("on"); $("velo2").classList.add("on");
  setTimeout(()=>$("fi-comprar").focus(), 60);
}
function cerrarFicha(){
  $("ficha").classList.remove("on"); $("ficha").setAttribute("aria-hidden","true");
  if(!$("panel").classList.contains("on") && !$("sumado").classList.contains("on")){ $("velo").classList.remove("on"); $("velo2").classList.remove("on"); }
}
$("productos").addEventListener("click", ev=>{
  const b = ev.target.closest(".leer"); if(b) abrirFicha(+b.dataset.i);
});
$("fi-cerrar").addEventListener("click", cerrarFicha);
$("fi-comprar").addEventListener("click", ()=>{ const i=+$("fi-comprar").dataset.i; cerrarFicha(); agregar(PRODUCTOS[i].id); });
$("velo").addEventListener("click", cerrarFicha);
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape") cerrarFicha(); });

pintarCarrito();

/* navegación: si la página no existe todavía, avisa */
let yendo=false;
async function existe(url){
  try{ const r=await fetch(url,{method:"HEAD"}); return r.ok; }catch(e){ return false; }
}
document.querySelectorAll(".zona").forEach(a=>{
  a.addEventListener("click", async ev=>{
    ev.preventDefault();
    const destino=a.getAttribute("href");
    if(destino==="tienda.html" || yendo) return;
    yendo=true;
    if(await existe(destino)){
      $("fundido").classList.add("on");
      await dormir(quieto?0:380);
      location.href=destino;
      return;
    }
    const s=$("screen").getBoundingClientRect(), r=a.getBoundingClientRect(), k=s.width/1920;
    const sello=$("pronto");
    sello.style.left=((r.left-s.left)/k + a.offsetWidth/2 - 48)+"px";
    sello.style.top =((r.top -s.top )/k + a.offsetHeight + 12)+"px";
    sello.classList.add("on");
    await dormir(1100);
    sello.classList.remove("on");
    yendo=false;
  });
});

function fit(){
  const s=$("screen"), stage=s.parentElement;
  const k=Math.min(stage.parentElement.clientWidth/1920, innerHeight/1080);
  s.style.transform="scale("+k+")";
  stage.style.height=(1080*k)+"px";
}
window.addEventListener("resize", fit); fit();
</script>
</body>
</html>
