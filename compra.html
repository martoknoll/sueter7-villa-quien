<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu compra — sueter7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist+Mono:wght@400;700&display=swap">
<style>
:root{
  --papel:#e9e4da; --crema:#efe9de; --tinta:#141414; --gris:#3a3a3a;
  --rojo:#c9452c; --amarillo:#e8c340; --azul:#2c61b2; --verde:#1f7a44;
  --display:"Bebas Neue","Haettenschweiler","Arial Narrow",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--mono);
  display:grid;place-items:center;padding:40px 20px}
.caja{width:100%;max-width:640px;background:var(--crema);border:3px solid var(--tinta);
  box-shadow:12px 12px 0 var(--tinta);padding:54px 56px}
.sello{display:inline-block;background:var(--amarillo);color:var(--tinta);padding:8px 16px 5px;
  font-family:var(--display);font-size:22px;letter-spacing:.12em;border:2.5px solid var(--tinta);
  transform:rotate(-2deg);margin-bottom:26px}
.sello.ok{background:var(--verde);color:#fffdf9}
.sello.error{background:var(--rojo);color:#fffdf9}
h1{font-family:var(--display);font-size:58px;line-height:.94;letter-spacing:.02em;margin:0 0 18px}
p{font-size:15px;line-height:1.75;color:var(--gris);margin:0 0 14px;max-width:52ch}
.ref{display:inline-block;margin-top:10px;font-size:12.5px;letter-spacing:.06em;color:var(--gris);
  background:#fffdf9;border:1.5px dashed var(--tinta);padding:7px 11px}
.acciones{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.b{display:grid;place-items:center;height:48px;padding:3px 22px 0;text-decoration:none;
  font-family:var(--display);font-size:21px;letter-spacing:.09em;color:var(--tinta);
  background:var(--crema);border:2.5px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta);
  transition:transform .1s,box-shadow .1s}
.b.fuerte{background:var(--amarillo)}
.b:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--tinta)}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
<script src="puente.js?v=20261029a"></script>
</head>
<body>
  <main class="caja">
    <span class="sello" id="sello">—</span>
    <h1 id="titulo">—</h1>
    <div id="texto"></div>
    <div id="ref"></div>
    <div class="acciones">
      <a class="b fuerte" href="tienda.html">Volver a la tienda</a>
      <a class="b" href="index.html">Ir al inicio</a>
    </div>
  </main>

<script>
"use strict";
const q = new URLSearchParams(location.search);

/* Mercado Pago vuelve con r= (lo definimos nosotros) y además agrega
   sus propios parámetros, como payment_id y status. */
const estado = q.get("r") || ({approved:"ok", pending:"pendiente", rejected:"error"})[q.get("status")] || "ok";

const CASOS = {
  ok: {
    clase:"ok", sello:"Pago aprobado", titulo:"¡Listo! Gracias.",
    texto:["Nos llegó el pago y ya estamos preparando el pedido.",
           "Te escribimos al mail que dejaste en Mercado Pago para coordinar la entrega. Si en un par de días no tenés noticias, escribinos y lo vemos."]
  },
  pendiente: {
    clase:"", sello:"Pago pendiente", titulo:"Falta que se acredite.",
    texto:["Elegiste un medio de pago que tarda en confirmarse, como efectivo o transferencia.",
           "Apenas Mercado Pago nos avise que entró, preparamos el pedido y te escribimos. No hace falta que hagas nada más."]
  },
  error: {
    clase:"error", sello:"Pago rechazado", titulo:"No se pudo cobrar.",
    texto:["Mercado Pago no pudo procesar el pago. Puede ser un problema con la tarjeta o con el límite disponible.",
           "Lo que tenías en el carrito sigue guardado: volvé a la tienda y probá de nuevo, o con otro medio de pago."]
  }
};

const c = CASOS[estado] || CASOS.ok;
const sello = document.getElementById("sello");
sello.textContent = c.sello;
sello.className = "sello " + c.clase;
document.getElementById("titulo").textContent = c.titulo;
document.getElementById("texto").innerHTML = c.texto.map(t=>"<p>"+t+"</p>").join("");

const pago = q.get("payment_id") || q.get("collection_id");
if(pago && pago !== "null"){
  document.getElementById("ref").innerHTML =
    '<span class="ref">Nº de operación: ' + pago.replace(/[^\w-]/g,"") + '</span>';
}

/* si el pago salió bien, el carrito ya no tiene sentido */
if(estado === "ok"){
  try{ localStorage.removeItem("s7-carrito"); }catch(e){}
}
</script>
</body>
</html>
