<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sueter7 — La Sencilla Villa Quién</title>
<meta name="description" content="Sitio oficial de sueter7. Todo salió bien en la Sencilla Villa Quién.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist+Mono:wght@400;700&display=swap">
<link rel="preload" as="image" href="img/estacion-5.webp">
<style>
:root{
  --papel:#e7dfd3; --crema:#fffdf9; --crema-var:#f4f0e6;
  --tinta:#141414; --gris:#333; --gris-claro:#bbbbbb;
  --rojo:#c9452c; --amarillo:#e8c340; --azul:#2c61b2;
  --display:"Bebas Neue","Arial Narrow",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --W:2172px; --H:1117px; --escena:1016px;
  --Wv:2172px; --off:0px;      /* ancho visible y corrimiento del centro: los ajusta fit() en widescreen */
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--crema-var);overflow:hidden}
body{font-family:var(--mono);color:var(--tinta);-webkit-font-smoothing:antialiased}

/* lienzo de 1117 de alto que se escala a la ventana; a lo ancho crece hasta 2950
   (widescreen) y la estación de 2172 (cinco puertas) queda centrada */
.lienzo{position:absolute;left:0;top:0;width:var(--Wv);height:var(--H);transform-origin:0 0;overflow:hidden;background:var(--crema-var)}
.fondo-ancho{position:absolute;left:0;top:0;width:var(--Wv);height:var(--escena);
  background:url("img/estacion-5.webp") calc(var(--off) - 437px) 0/3000px 1016px no-repeat}

/* ---------- escena: la estación ---------- */
.escena{position:absolute;left:var(--off);top:0;width:var(--W);height:var(--escena)}
.logo{position:absolute;left:41px;top:36px;width:350px;height:90px;border-radius:2px}
.proyecto{position:absolute;left:18px;top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(20,20,20,.5);text-decoration:none;padding:2px 4px}
.proyecto:hover{color:var(--rojo)}

.puerta{position:absolute;display:block;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.puerta img{position:absolute;display:block;pointer-events:none;user-select:none}
.puerta .door{transition:filter .25s ease}
.puerta .sign{z-index:2;transition:transform .16s ease, box-shadow .16s ease}
.puerta:hover .sign,.puerta:focus-visible .sign{transform:translate(-4px,-5px);box-shadow:8px 9px 0 var(--tinta)}
.puerta:hover .door,.puerta:focus-visible .door{filter:brightness(1.08) saturate(1.25) contrast(1.04)}
.puerta:focus-visible .sign{outline:3px solid var(--crema);outline-offset:4px}
.puerta:active .sign{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--tinta)}
/* la puerta se abre (bisagra a la izquierda) y deja ver el hueco oscuro */
.puerta .hueco{position:absolute;z-index:0;background:radial-gradient(ellipse at 50% 70%,#2a2a2a,#050505 70%);
  box-shadow:inset 0 0 26px #000}
.puerta .door{z-index:1;transform-origin:0 50%;transition:filter .25s ease,transform .5s cubic-bezier(.6,0,.3,1)}
.puerta.abierta .door{transform:perspective(900px) rotateY(-74deg);filter:brightness(.62)}

/* ---------- sección abierta (se carga adentro, la música sigue) ---------- */
.seccion{position:absolute;left:0;top:0;width:var(--Wv);height:var(--escena);z-index:5;background:var(--papel);
  clip-path:inset(0 0 0 0);transition:clip-path .55s cubic-bezier(.7,0,.2,1), opacity .3s ease}
.seccion iframe{display:block;width:100%;height:100%;border:0;background:var(--papel)}
.seccion.cerrada{pointer-events:none;opacity:0}

/* ---------- reproductor persistente ---------- */
.player{position:absolute;left:0;top:var(--escena);width:var(--Wv);height:calc(var(--H) - var(--escena));
  background:var(--crema-var);border-top:2.5px solid var(--tinta);z-index:10;color:var(--tinta)}
.pl-in{position:absolute;left:calc(var(--off) + (var(--W) - 1728px) / 2);top:0;width:1728px;height:100%}
.pl-in > *{position:absolute}
.pthumb{left:13px;top:26px;width:60px;height:60px;overflow:hidden;background:var(--azul);padding:0;border:0;cursor:pointer}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.ptitle{left:90px;top:35px;font-size:16px;font-weight:700;line-height:1.2;max-width:350px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palbum{left:90px;top:60px;font-size:13px;line-height:1.2;color:var(--gris);max-width:360px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit}
.ctl{background:transparent;border:0;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--tinta)}
.ctl:focus-visible,.circ:focus-visible{outline:2px solid var(--rojo);outline-offset:3px;border-radius:4px}
.ctl svg{display:block;transition:transform .1s ease, opacity .15s}
.ctl:hover svg{transform:scale(1.1)}
.ctl:active svg{transform:scale(.92)}
.circ{border-radius:50%;background:var(--tinta);color:var(--crema-var);border:0;padding:0;cursor:pointer;
  display:grid;place-items:center;text-decoration:none;transition:transform .12s ease}
.circ:hover{transform:scale(1.06)}
.circ:active{transform:scale(.95)}
.pplay{left:476px;top:32.5px;width:47px;height:47px}
.pseek{left:548px;top:46px;width:626px;height:20px;cursor:pointer;touch-action:none}
.pseek::before{content:"";position:absolute;left:0;right:0;top:8.25px;height:3.5px;background:var(--gris-claro)}
.pseek i{position:absolute;left:0;top:8.25px;height:3.5px;width:0;background:var(--rojo)}
.pseek b{position:absolute;left:0;top:2.5px;width:15px;height:15px;border-radius:50%;background:var(--tinta);transform:translateX(-50%);transition:transform .1s}
.pseek:hover b{transform:translateX(-50%) scale(1.15)}
.pcur{left:548px;top:72px;font-size:11px;line-height:1;color:var(--gris);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pdur{left:1074px;top:72px;width:100px;text-align:right;font-size:11px;line-height:1;color:var(--gris);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.p-tren{left:1232px;top:36px;width:44px;height:40px}
.p-tren[aria-pressed="false"]{opacity:.55}
.p-shuffle{left:1294px;top:36px;width:40px;height:40px}
.p-shuffle[aria-pressed="true"]{color:var(--rojo)}
.p-prev{left:1348.5px;top:36px;width:40px;height:40px}
.p-next{left:1398.5px;top:36px;width:40px;height:40px}
.p-vol{left:1451px;top:36px;width:38px;height:40px}
.pvolbar{left:1487px;top:46px;width:78px;height:20px;cursor:pointer;touch-action:none}
.pvolbar::before{content:"";position:absolute;left:0;right:0;top:9px;height:2.5px;background:var(--gris-claro)}
.pvolbar i{position:absolute;left:0;top:9px;height:2.5px;width:100%;background:var(--tinta)}
.pspot{top:36px;width:40px;height:40px}
.pspot.a{left:1602px}
.pspot.b{left:1656px;width:38px;height:38px;top:37px}
.perr{right:18px;top:-24px;background:var(--rojo);color:var(--crema);font-size:10px;letter-spacing:.07em;
  padding:3px 9px;border:2px solid var(--tinta)}

/* ---------- cartel "Creá tu versión" pegado en la pared ---------- */
@font-face{font-family:"Tiny5";src:url("tu-version/fonts/tiny5-latin.woff2") format("woff2");font-display:swap}
.cartel-tv{position:absolute;left:1245px;top:438px;width:112px;height:196px;z-index:2;display:block;text-decoration:none;color:#090909;
  background:#f7f1e8;border:2.5px solid #090909;box-shadow:5px 5px 0 #090909;transform:rotate(-2.5deg);transition:transform .16s,box-shadow .16s;
  padding:22px 10px 8px;font-family:var(--mono)}
.cartel-tv::before{content:"";position:absolute;inset:0;opacity:.14;pointer-events:none;
  background-image:radial-gradient(#090909 .9px,transparent 1.1px);background-size:4px 4px}
.cartel-tv{transform-origin:50% -10px;animation:tv-hamaca 3.4s ease-in-out infinite}
.cartel-tv:hover,.cartel-tv:focus-visible{animation-play-state:paused;transform:rotate(-1deg) translate(-3px,-4px);box-shadow:8px 9px 0 #090909;outline:none}
@keyframes tv-hamaca{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(2deg)}}
.ctv-sello{animation:tv-latido 1.6s ease-in-out infinite}
@keyframes tv-latido{0%,100%{transform:rotate(12deg) scale(1)}50%{transform:rotate(12deg) scale(1.18)}}
.ctv-pie{animation:tv-pie 1.6s ease-in-out infinite}
@keyframes tv-pie{0%,100%{background:#e8c229}50%{background:#fffdf9}}

/* ---------- cartel colgado del techo con la frase ----------
   papel fotocopiado, bordes comidos, colgado con hilo y cinta, un poco torcido */
.frase{position:absolute;left:1086px;top:150px;z-index:2;transform:translateX(-50%);pointer-events:none}
.frase-in{position:relative;transform-origin:42% -48px;animation:frase-hamaca 7s ease-in-out infinite}
.frase-hilos{position:absolute;left:0;top:-52px;width:100%;height:60px;overflow:visible}
.frase-papel{position:relative;display:block;padding:14px 34px 9px 30px;transform:rotate(-1.6deg)}
.frase-papel::before{content:"";position:absolute;inset:0;z-index:-1;filter:url(#comido-frase);
  background:
    radial-gradient(rgba(20,20,20,.22) .9px,transparent 1.2px) 0 0/5px 5px,
    linear-gradient(97deg,#f1ebdf 0%,#e9e1d1 55%,#efe8da 100%);
  box-shadow:5px 6px 0 rgba(10,10,10,.5)}
.frase-papel::after{content:"";position:absolute;left:-14px;top:-10px;width:62px;height:20px;transform:rotate(-24deg);
  background:rgba(226,215,192,.88);border-left:1px solid rgba(20,20,20,.18);border-right:1px solid rgba(20,20,20,.18)}
.frase-cartel{display:block;white-space:nowrap;color:#141414;font-family:var(--display);font-size:34px;
  letter-spacing:.06em;line-height:1;text-transform:uppercase;text-shadow:.6px .4px 0 rgba(20,20,20,.55)}
.frase-cartel i{font-style:normal;display:inline-block}
.frase-cartel .r1{transform:rotate(-1.5deg) translateY(1px)}
.frase-cartel .r2{transform:rotate(1.2deg) translateY(-1px)}
.frase-cartel .marca{background:#e8c229;padding:0 6px;margin:0 2px;transform:rotate(-2deg)}
.frase-cartel b{color:var(--rojo);font-weight:400}
.frase-sello{position:absolute;right:-22px;top:-16px;padding:3px 7px 2px;transform:rotate(9deg);background:#d24426;color:#fffdf9;
  border:2px solid #141414;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em}
@keyframes frase-hamaca{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.cartel-tv:focus-visible{outline:3px solid var(--crema);outline-offset:4px}
.ctv-cinta{position:absolute;left:23px;top:-12px;width:66px;height:20px;transform:rotate(4deg);
  background:rgba(231,223,211,.82);border-left:1px solid rgba(9,9,9,.18);border-right:1px solid rgba(9,9,9,.18)}
.ctv-sello{position:absolute;right:-16px;top:-14px;width:46px;height:46px;border-radius:50%;background:#d24426;color:#fff;border:2px solid #090909;
  display:grid;place-items:center;font-family:"Courier New",monospace;font-size:9.5px;font-weight:900;transform:rotate(12deg)}
.ctv-kicker{display:block;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#d24426}
.ctv-titulo{display:block;margin-top:6px;font-family:"PP NeueBit","Tiny5",monospace;font-size:25px;line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
.ctv-foto{position:absolute;left:12px;top:118px;width:54px;height:42px;background:#2c61b2;border:2px solid #090909;transform:rotate(4deg)}
.ctv-foto i{position:absolute;left:16px;top:5px;width:17px;height:17px;border-radius:50%;background:#e7dfd3;border:2px solid #090909}
.ctv-foto i::after{content:"";position:absolute;left:-9px;top:18px;width:31px;height:13px;border-radius:14px 14px 0 0;background:#e7dfd3;border:2px solid #090909;border-bottom:0}
.ctv-pie{position:absolute;left:10px;bottom:8px;font-size:9px;font-weight:700;letter-spacing:.04em;background:#e8c229;padding:2px 4px;border:1.5px solid #090909}

/* ---------- Mari, caminando por el andén ---------- */
.piso{position:absolute;left:calc(-1 * var(--off));top:748px;width:var(--Wv);height:96px;cursor:pointer;z-index:1}
.mari{position:absolute;left:0;top:0;width:112px;height:208px;z-index:3;pointer-events:none;
  background:url("img/mari.png") 0 0/1344px 208px no-repeat;image-rendering:pixelated;
  transform-origin:50% 100%;will-change:transform,opacity}
.mari.entra{transition:transform .5s ease-in, opacity .5s ease-in, filter .5s ease-in}
.mobile-swipe{display:none}

/* ---------- portada mobile ----------
   Una puerta por pantalla, con scroll horizontal y encastre entre estaciones. */
@media (max-width:700px) and (orientation:portrait){
  html,body{width:100%;height:100%;min-height:100%;background:var(--crema-var);overflow:hidden}
  .lienzo{position:fixed;inset:0;width:100vw!important;height:100dvh!important;transform:none!important;
    overflow:hidden;background:var(--crema-var)}
  .fondo-ancho{width:100vw!important;height:calc(100dvh - 132px);
    background:url("fondo.png") center/cover no-repeat;filter:contrast(.95)}
  .escena{left:0!important;top:0;width:100vw;height:calc(100dvh - 132px);overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;touch-action:pan-x}
  .escena::-webkit-scrollbar{display:none}
  .escena::after{content:"";position:absolute;left:calc(var(--mobile-track-width,400vw) - 1px);top:0;width:1px;height:1px}

  .logo{position:fixed;left:16px;top:15px;width:145px;height:47px;z-index:5;color:var(--tinta);text-decoration:none}
  .logo::before{content:"SUETER";font-family:var(--display);font-size:35px;line-height:47px;letter-spacing:.01em}
  .logo::after{content:"7";margin-left:7px;font-family:var(--display);font-size:35px;line-height:47px;color:var(--rojo)}
  .proyecto{position:fixed;left:auto;right:12px;top:17px;z-index:5;font-size:8px;background:rgba(255,253,249,.88);
    border:1.5px solid var(--tinta);padding:5px 7px;box-shadow:3px 3px 0 var(--tinta)}

  .puerta{transform-origin:0 0;z-index:2;touch-action:manipulation;scroll-snap-align:center;scroll-snap-stop:always;
    isolation:isolate}
  .puerta::before{content:"";position:absolute;left:-6px;right:-6px;top:84px;bottom:-25px;z-index:-2;
    background-color:#d7d2c8;
    background-image:linear-gradient(rgba(20,20,20,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(20,20,20,.07) 1px,transparent 1px),
      radial-gradient(rgba(20,20,20,.18) .8px,transparent 1px);
    background-size:34px 24px,34px 24px,5px 5px;border:3px solid var(--tinta);
    box-shadow:0 12px 0 var(--tinta),0 18px 0 #c9c5bc,0 21px 0 var(--tinta)}
  .puerta::after{content:"";position:absolute;left:15px;right:15px;top:99px;bottom:-8px;z-index:-1;
    background:#191919;border:3px solid var(--tinta);box-shadow:inset 0 0 24px #000}
  .puerta .door{border:2.5px solid var(--tinta);box-shadow:none;
    transform-origin:left center;transition:transform .24s cubic-bezier(.7,0,.2,1),filter .2s}
  .puerta .sign{box-shadow:6px 7px 0 var(--tinta)}
  .puerta.abriendo .door{transform:perspective(650px) rotateY(-18deg) translateX(-4px);filter:brightness(.8)}
  .puerta:hover .sign,.puerta:focus-visible .sign{transform:translate(-2px,-2px);box-shadow:8px 9px 0 var(--tinta)}
  .puerta:active{filter:brightness(1.08) saturate(1.25)}
  .piso,.mari,.frase{display:none}
  .cartel-tv{animation:tv-latido-m 1.8s ease-in-out infinite}

  .mobile-swipe{position:fixed;display:flex;align-items:center;gap:8px;left:50%;top:67px;z-index:5;
    transform:translateX(-50%);padding:4px 8px;background:rgba(255,253,249,.88);border:1.5px solid var(--tinta);
    font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .mobile-swipe i{display:block;width:6px;height:6px;border:1px solid var(--tinta);border-radius:50%;background:transparent}
  .mobile-swipe i.activo{background:var(--rojo)}
  .mobile-swipe span:last-child{display:inline-block;animation:indicar-swipe 1.1s ease-in-out infinite alternate}

  .cartel-tv{position:fixed;left:16px!important;right:16px;top:auto!important;bottom:142px;width:auto;height:58px;z-index:5;
    display:block;padding:7px 12px;transform:rotate(-.5deg);box-shadow:4px 4px 0 #090909}
  .cartel-tv:hover,.cartel-tv:focus-visible{transform:translate(-2px,-2px) rotate(-.5deg);box-shadow:6px 6px 0 #090909}
  .ctv-cinta,.ctv-foto{display:none}
  .ctv-sello{display:none}
  .ctv-kicker{position:relative;z-index:1;font-size:7px;line-height:1;letter-spacing:.16em}
  .ctv-titulo{position:relative;z-index:1;margin:4px 0 0;font-size:0;line-height:1;white-space:nowrap}
  .ctv-titulo::after{content:"CREÁ TU VERSIÓN";font-size:23px;letter-spacing:.01em}
  .ctv-pie{display:none}

  .seccion{width:100vw;height:calc(100dvh - 132px)}
  .player{left:0;top:calc(100dvh - 132px);width:100vw;height:132px;border-top-width:3px}
  .pl-in{left:0;top:0;width:100vw;height:100%}
  .pthumb{left:12px;top:10px;width:52px;height:52px}
  .ptitle{left:76px;top:12px;max-width:calc(100vw - 128px);font-size:14px}
  .palbum{left:76px;top:34px;max-width:calc(100vw - 128px);font-size:10px;line-height:1.25}
  .pplay{left:13px;top:76px;width:42px;height:42px}
  .pplay,.pspot.b{box-shadow:3px 3px 0 var(--rojo)}
  .p-prev{left:64px;top:77px;width:34px;height:36px}
  .p-next{left:105px;top:77px;width:34px;height:36px}
  .p-prev,.p-next{background:var(--crema-var);border:1.5px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta)}
  .pseek{left:151px;top:78px;width:calc(100vw - 165px);height:24px}
  .pseek::before,.pseek i{top:10px;height:4px}
  .pseek b{top:4px;width:16px;height:16px}
  .pcur{left:151px;top:108px;font-size:9px}
  .pdur{left:auto;right:14px;top:108px;width:auto;font-size:9px}
  .p-shuffle,.p-vol,.pvolbar,.pspot.a{display:none}
  .p-tren{left:auto;right:56px;top:13px;width:38px;height:36px}
  .pspot.b{left:auto;right:12px;top:13px;width:36px;height:36px}
  .perr{right:10px;top:-24px}
}

@keyframes indicar-swipe{to{transform:translateX(4px)}}
@keyframes tv-latido-m{0%,100%{box-shadow:4px 4px 0 #090909}50%{box-shadow:4px 4px 0 #090909,0 0 0 5px rgba(232,194,41,.75)}}

@media (prefers-reduced-motion: reduce){
  .seccion,.puerta .sign,.circ,.ctl svg{transition:none !important}
  .mobile-swipe span:last-child{animation:none !important}
  .cartel-tv,.ctv-sello,.ctv-pie,.frase-in{animation:none !important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="comido-frase" x="-4%" y="-20%" width="108%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="11" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="lienzo" id="lienzo">

  <main class="escena" id="escena" aria-label="Andén de la Sencilla Villa Quién">

    <a class="logo" href="#" aria-label="sueter7 — volver al andén" data-ir=""></a>

      <span>deslizá</span><i class="activo"></i><i></i><i></i><i></i><i></i><span>→</span>
    </div>
    <div class="piso" id="piso" title="Hacé clic en el andén para caminar" aria-hidden="true"></div>

    <a class="puerta" href="#sueter7" data-ir="sueter7" aria-label="Sueter7 — la banda"
       style="left:100px;top:305.5px;width:282.5px;height:431px">
      <img class="door" src="img/puerta-sueter7.webp" alt="" style="left:24.5px;top:110px;width:231px;height:321px">
      <img class="sign" src="img/cartel-sueter7.webp" alt="" style="left:0;top:0;width:282.5px;height:94.5px">
    </a>

<script>
"use strict";
const $=id=>document.getElementById(id);
const W=2172, H=1117;

/* ---------- escala del lienzo ---------- */
const WMAX=2950;                       // hasta dónde alcanza img/estacion-5.webp a lo ancho
const portadaMobile=matchMedia("(max-width:700px) and (orientation:portrait)");
const puertasMobile=[...document.querySelectorAll(".puerta")];
/* a cada puerta le agrega su hueco oscuro, del mismo tamaño que la hoja */
puertasMobile.forEach(p=>{
  const d=p.querySelector(".door"), h=document.createElement("span");
  h.className="hueco"; h.setAttribute("aria-hidden","true"); h.style.cssText=d.style.cssText; p.insertBefore(h,d);
});
puertasMobile.forEach(p=>{
  p.dataset.desktopLeft=p.style.left;
  p.dataset.desktopTop=p.style.top;
});
let Wv=W, OFF=0;
let pasoMobile=innerWidth;
function ordenarPuertasMobile(){
  const altoEscena=innerHeight-132, cabecera=100, cta=78;
  const anchoMax=Math.max(...puertasMobile.map(p=>parseFloat(p.style.width)));
  const altoPuerta=Math.max(...puertasMobile.map(p=>parseFloat(p.style.height)));
  const escala=Math.max(.36,Math.min(1.12,(innerWidth-48)/anchoMax,(altoEscena-cabecera-cta)/altoPuerta));
  const y=cabecera+Math.max(0,(altoEscena-cabecera-cta-altoPuerta*escala)/2);
  pasoMobile=innerWidth*.72;               // la próxima puerta entra cerca de un cuarto de pantalla
  puertasMobile.forEach((p,i)=>{
    const ancho=parseFloat(p.style.width)*escala;
    const centro=innerWidth*.45+i*pasoMobile;
    p.style.left=(centro-ancho/2)+"px";
    p.style.top=y+"px";
    p.style.transform=`scale(${escala})`;
  });
  $("escena").style.setProperty("--mobile-track-width",(innerWidth+(puertasMobile.length-1)*pasoMobile)+"px");
}
function restaurarPuertasDesktop(){
  puertasMobile.forEach(p=>{
    p.style.left=p.dataset.desktopLeft;
    p.style.top=p.dataset.desktopTop;
    p.style.transform="";
  });
}
function fit(){
  if(portadaMobile.matches){
    Wv=innerWidth; OFF=0;
    const l=$("lienzo");
    l.style.setProperty("--Wv",Wv+"px"); l.style.setProperty("--off","0px");
    l.style.transform="none";
    ordenarPuertasMobile();
    return;
  }
  restaurarPuertasDesktop();
  let k=innerHeight/H;
  Wv=Math.min(WMAX, Math.max(W, innerWidth/k));
  if(Wv*k>innerWidth) k=innerWidth/Wv;          // pantallas angostas: manda el ancho
  OFF=(Wv-W)/2;
  const x=(innerWidth-Wv*k)/2, y=(innerHeight-H*k)/2;
  const l=$("lienzo");
  l.style.setProperty("--Wv", Wv+"px"); l.style.setProperty("--off", OFF+"px");
  l.style.transform=`translate(${x}px,${y}px) scale(${k})`;
  if(window.ANDEN){ ANDEN.x0=40-OFF; ANDEN.x1=W-40+OFF; }
}
addEventListener("resize", fit); fit();

/* marca la puerta visible durante el scroll horizontal de mobile */
const puntosMobile=[...document.querySelectorAll(".mobile-swipe i")];
$("escena").addEventListener("scroll", ()=>{
  if(!portadaMobile.matches) return;
  const pagina=Math.max(0,Math.min(puertasMobile.length-1,Math.round($("escena").scrollLeft/pasoMobile)));
  puntosMobile.forEach((p,i)=>p.classList.toggle("activo",i===pagina));
}, {passive:true});

/* ---------- navegación entre secciones ---------- */
const VERSION="20261030c";             // cambiarla al publicar fuerza a recargar las secciones
const PAGINAS={sueter7:"sueter7.html", diario:"diario.html", discos:"discos.html", tienda:"tienda.html",
  fechas:"fechas.html", letras:"letras.html", compra:"compra.html"};
const NOMBRES={sueter7:"Sueter7", diario:"Diario", discos:"Discos", tienda:"Tienda",
  fechas:"Fechas", letras:"Letras", compra:"Tu compra"};
const sec=$("seccion"), marco=$("marco");
const quieto=matchMedia("(prefers-reduced-motion: reduce)");
let abierta="";          /* la ruta abierta: nombre + consulta, p. ej. "letras?tema=3" */

const partir=ruta=>{ const i=ruta.indexOf("?"); return i<0 ? [ruta,""] : [ruta.slice(0,i), ruta.slice(i)]; };
function recorte(nombre){
  // la sección se abre desde la puerta que se tocó (o desde el centro si no tiene puerta)
  if(portadaMobile.matches) return "inset(50% 50% 50% 50%)";
  const p=document.querySelector(`.puerta[data-ir="${nombre}"]`);
  if(!p) return "inset(50% 50% 50% 50%)";
  const l=parseFloat(p.style.left), t=parseFloat(p.style.top), w=parseFloat(p.style.width), h=parseFloat(p.style.height);
  return `inset(${t}px ${Wv-OFF-l-w}px ${1016-t-h}px ${OFF+l}px)`;
}
/* ---------- sonido de tren: suena sólo al entrar o cambiar de sección (nunca solo) ---------- */
let trenOn=true; try{ trenOn=localStorage.getItem("s7-tren")!=="0"; }catch(e){}
let ctxTren=null;
function pintarTren(){
  $("p-tren").setAttribute("aria-pressed", String(trenOn));
  $("p-tren").title="Sonido de tren: "+(trenOn?"activado":"silenciado");
  $("ico-tren-x").toggleAttribute("hidden", trenOn);
}
function trenPasa(){
  if(!trenOn) return;
  try{
    ctxTren=ctxTren||new (window.AudioContext||window.webkitAudioContext)();
    const c=ctxTren, t0=c.currentTime+.02, dur=2.6;
    if(c.state==="suspended") c.resume();
    const sal=c.createGain(); sal.gain.value=.32; sal.connect(c.destination);
    // ruido para el rodar del tren
    const buf=c.createBuffer(1, c.sampleRate*dur, c.sampleRate), d=buf.getChannelData(0);
    let ult=0; for(let i=0;i<d.length;i++){ const b=Math.random()*2-1; ult=(ult+.02*b)/1.02; d[i]=ult*3.2; }
    const ruido=c.createBufferSource(); ruido.buffer=buf;
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(260,t0);
    lp.frequency.linearRampToValueAtTime(900,t0+dur*.45); lp.frequency.linearRampToValueAtTime(220,t0+dur);
    const env=c.createGain(); env.gain.setValueAtTime(0.0001,t0);
    env.gain.exponentialRampToValueAtTime(1,t0+dur*.42); env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    ruido.connect(lp).connect(env).connect(sal); ruido.start(t0); ruido.stop(t0+dur);
    // el traqueteo de las ruedas sobre las juntas
    for(let k=0;k<9;k++){
      const tk=t0+.18+k*.25;
      [0,.075].forEach(dt=>{
        const o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
        o.type="square"; o.frequency.value=70+Math.random()*12; f.type="bandpass"; f.frequency.value=420;
        const fuerza=Math.sin(Math.PI*(k+.5)/9)*.55;
        g.gain.setValueAtTime(0.0001,tk+dt); g.gain.exponentialRampToValueAtTime(fuerza+.001,tk+dt+.008);
        g.gain.exponentialRampToValueAtTime(0.0001,tk+dt+.09);
        o.connect(f).connect(g).connect(sal); o.start(tk+dt); o.stop(tk+dt+.1);
      });
    }
  }catch(e){}
}
$("p-tren").addEventListener("click", ()=>{
  trenOn=!trenOn; try{ localStorage.setItem("s7-tren", trenOn?"1":"0"); }catch(e){}
  pintarTren(); if(trenOn) trenPasa();
});
pintarTren();

function ir(nombre, q){
  nombre = PAGINAS[nombre] ? nombre : "";
  if(nombre && partir(abierta)[0]!==nombre) trenPasa();
  q = nombre ? (q||"") : "";
  if(nombre==="letras" && !q) q="?tema="+TRACKS[cur].n;   // las letras abren en el tema que suena
  const ruta = nombre + q;
  if(decodeURIComponent(location.hash.slice(1)) !== ruta){
    history.pushState(null, "", ruta ? "#"+ruta : location.pathname+location.search);
  }
  mostrar(ruta);
}
function mostrar(ruta){
  if(ruta===abierta) return;
  const [nombre, q]=partir(ruta);
  if(nombre && !PAGINAS[nombre]) return mostrar("");
  const anterior=partir(abierta)[0]; abierta=ruta;
  sec.style.transition = quieto.matches ? "none" : "";
  if(nombre){
    const src=PAGINAS[nombre]+(q ? q+"&" : "?")+"v="+VERSION;
    // replace() en vez de cambiar src: así el iframe no suma pasos al historial
    // y el botón "atrás" del navegador sigue el hash de la estación
    if(marco.dataset.pagina!==src){ marco.dataset.pagina=src; marco.contentWindow.location.replace(src); }
    document.title = NOMBRES[nombre]+" — sueter7";
    sec.style.clipPath = anterior ? "inset(0 0 0 0)" : recorte(nombre);
    sec.classList.remove("cerrada"); sec.setAttribute("aria-hidden","false");
    $("escena").setAttribute("aria-hidden","true"); $("escena").inert=true;
    void sec.offsetWidth;                         // fija el recorte inicial y anima desde la puerta
    sec.style.clipPath="inset(0 0 0 0)";
    setTimeout(()=>{ try{ marco.focus(); }catch(e){} }, 120);
  }else{
    document.title="sueter7 — La Sencilla Villa Quién";
    sec.style.clipPath = recorte(anterior);
    sec.classList.add("cerrada"); sec.setAttribute("aria-hidden","true");
    $("escena").removeAttribute("aria-hidden"); $("escena").inert=false;
    const p=document.querySelector(`.puerta[data-ir="${anterior}"]`); if(p) p.focus({preventScroll:true});
    salirPorPuerta(anterior);
  }
}
document.querySelectorAll("[data-ir]").forEach(a=>a.addEventListener("click", ev=>{
  ev.preventDefault();
  if(a.classList.contains("puerta")) entrarPorPuerta(a.dataset.ir); else ir(a.dataset.ir);
}));

/* ---------- Mari camina por el andén y entra por las puertas ----------
   Sprite de 12 cuadros (img/mari.png, 28×52 px ampliado ×4):
   0–7 caminata de costado · 8–10 de espaldas · 11 de frente           */
const mari=$("mari");
const ANDEN=window.ANDEN={x0:40-OFF, x1:W-40+OFF, y0:752, y1:832};
const PUERTA_X={sueter7:223, diario:659, discos:1075, tienda:1515, fechas:1937, "tu-version":1296};
const mp={x:791, y:818, dir:1, cuadro:11, ocupada:false, viaje:0};
const escalaMari=y=>0.88+0.12*Math.max(0,Math.min(1,(y-ANDEN.y0)/(ANDEN.y1-ANDEN.y0)));
function pintarMari(){
  mari.style.backgroundPosition=(-mp.cuadro*112)+"px 0";
  const s=escalaMari(mp.y);
  mari.style.transform=`translate(${mp.x-56}px,${mp.y-208}px) scale(${mp.dir<0?-s:s},${s})`;
}
let quietoDesde=null;
const BANCO={x0:251, x1:621, y:824};                     // por delante del banco, nunca a través
function caminarA(x,y){
  x=Math.max(ANDEN.x0,Math.min(ANDEN.x1,x)); y=Math.max(ANDEN.y0,Math.min(ANDEN.y1,y));
  if(x>BANCO.x0 && x<BANCO.x1) y=Math.max(y, BANCO.y);
  const viaje=++mp.viaje;
  /* Mari camina siempre: el recorrido es parte de la navegación, no un adorno */
  return new Promise(listo=>{
    let previo=performance.now(), recorrido=0;
    function paso(t){
      if(viaje!==mp.viaje) return listo();               // otro clic la mandó a otro lado
      const dt=Math.min(.05,(t-previo)/1000); previo=t;
      const dx=x-mp.x, dy=y-mp.y, d=Math.hypot(dx,dy);
      if(d<1.5){
        mp.x=x; mp.y=y;
        mp.cuadro = mp.cuadro>=8 && mp.cuadro<=10 ? 8 : 2;   // queda quieta en la última pose
        pintarMari(); quietoDesde=performance.now(); return listo();
      }
      const v=Math.min(d, 330*dt);                           // 330 px por segundo
      mp.x+=dx/d*v; mp.y+=dy/d*v; recorrido+=v;
      if(Math.abs(dx)>=Math.abs(dy)*0.8){ mp.dir=dx<0?-1:1; mp.cuadro=Math.floor(recorrido/11)%8; }
      else if(dy<0){ mp.dir=1; mp.cuadro=8+[1,0,2,0][Math.floor(recorrido/9)%4]; }  // se aleja: de espaldas
      else { mp.dir=1; mp.cuadro=11; }
      pintarMari(); requestAnimationFrame(paso);
    }
    quietoDesde=null; requestAnimationFrame(paso);
  });
}
/* después de un rato quieta, se da vuelta y mira a la pantalla */
setInterval(()=>{
  if(quietoDesde && performance.now()-quietoDesde>1600 && mp.cuadro!==11 && !mp.ocupada){
    mp.cuadro=11; mp.dir=1; pintarMari(); quietoDesde=null;
  }
}, 400);
$("piso").addEventListener("click", ev=>{
  if(mp.ocupada) return;
  const r=$("lienzo").getBoundingClientRect(), k=r.width/Wv;
  caminarA((ev.clientX-r.left)/k-OFF, (ev.clientY-r.top)/k);
});
async function entrarPorPuerta(nombre){
  if(mp.ocupada) return;
  const px=PUERTA_X[nombre];
  const salir=()=>{ if(nombre==="tu-version") location.href="tu-version/"; else ir(nombre); };
  if(portadaMobile.matches){
    const puerta=document.querySelector(`.puerta[data-ir="${nombre}"]`);
    if(puerta){
      puerta.classList.add("abriendo");
      await new Promise(r=>setTimeout(r,230));
      setTimeout(()=>puerta.classList.remove("abriendo"),500);
    }
    salir(); return;
  }
  if(px==null){ salir(); return; }
  mp.ocupada=true;
  const cruzaBanco=Math.min(mp.x,px)<BANCO.x1 && Math.max(mp.x,px)>BANCO.x0;
  if(Math.abs(mp.x-px)>4){
    if(cruzaBanco && mp.y<BANCO.y) await caminarA(mp.x, BANCO.y);   // primero sale de atrás del banco
    await caminarA(px, cruzaBanco ? BANCO.y : Math.max(mp.y, 800));
  }
  await caminarA(px, ANDEN.y0);
  /* se abre la puerta, Mari entra de espaldas y se pierde en lo oscuro */
  const puerta=document.querySelector(`.puerta[data-ir="${nombre}"]`);
  if(puerta){ puerta.classList.add("abierta"); mp.cuadro=8; mp.dir=1; pintarMari(); await new Promise(r=>setTimeout(r, 520)); }
  mari.classList.add("entra");
  mari.style.opacity="0"; mari.style.filter="brightness(.15)";
  mari.style.transform+=" translateY(-26px) scale(.78)";
  await new Promise(r=>setTimeout(r, 480));
  salir();
  if(puerta) setTimeout(()=>puerta.classList.remove("abierta"), 700);
}
/* el cartel de "Tu versión": Mari camina hasta la pared y entra (es una página aparte) */
$("cartel-tv").addEventListener("click", ev=>{ ev.preventDefault(); entrarPorPuerta("tu-version"); });
/* al volver con "atrás" del navegador, la página puede venir de la caché con Mari invisible */
addEventListener("pageshow", ev=>{ if(ev.persisted){ mari.classList.remove("entra"); mari.style.opacity="1"; mari.style.filter=""; mp.ocupada=false; pintarMari(); } });
/* al volver al andén, sale por la misma puerta y queda mirando */
function salirPorPuerta(nombre){
  const px=PUERTA_X[nombre];
  mari.classList.remove("entra"); mari.style.filter="";
  const puerta=document.querySelector(`.puerta[data-ir="${nombre}"]`);
  if(puerta && !portadaMobile.matches){
    puerta.classList.add("abierta"); setTimeout(()=>puerta.classList.remove("abierta"), 900);
  }
  if(px!=null){ mp.x=px; mp.y=ANDEN.y0+18; }
  mp.cuadro=11; mp.dir=1; mp.ocupada=false; mp.viaje++;
  mari.style.opacity="1"; pintarMari();
  if(px!=null) setTimeout(()=>caminarA(px, 812), 420);
}
pintarMari();
addEventListener("popstate", ()=> mostrar(decodeURIComponent(location.hash.slice(1))));
addEventListener("keydown", ev=>{ if(ev.key==="Escape" && abierta) ir(""); });
$("p-thumb").addEventListener("click", ()=> ir("discos"));

/* ---------- reproductor ---------- */
const DISCO="sueter7 - Todo Salió Bien en la Sencilla Villa Quién - ";
const TRACKS=[
  {n:1,t:"Escritorio",d:398},{n:2,t:"Confluencias",d:220},{n:3,t:"Enero Cuervo",d:333},
  {n:4,t:"De Chungking a Mendoza",d:322},{n:5,t:"Mapache",d:252},{n:6,t:"Almohadas",d:311},
  {n:7,t:"Miedos de Transporte",d:308},{n:8,t:"Todo Salió Bien (Carta para un amigo)",d:554}
].map(x=>({...x, f:DISCO+String(x.n).padStart(2,"0")+" "+x.t+".mp3"}));

const au=$("au");
let cur=0, loaded=false, aleatorio=false, volumen=1;
const mmss=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";

function guardar(){
  try{ localStorage.setItem("s7-player", JSON.stringify({cur, t:au.currentTime||0, vol:volumen, muted:au.muted, aleatorio})); }catch(e){}
}
function cargar(i, reproducir, desde){
  cur=(i+TRACKS.length)%TRACKS.length;
  const tr=TRACKS[cur];
  au.src=tr.f; loaded=true; $("p-err").hidden=true;
  if(desde) au.addEventListener("loadedmetadata", ()=>{ try{ au.currentTime=desde; }catch(e){} }, {once:true});
  $("p-title").textContent=tr.t;
  $("p-dur").textContent=mmss(tr.d);
  pintarTiempo(desde||0, tr.d);
  if(reproducir) au.play().catch(()=>{});
  avisar(); guardar();
}
function pintarTiempo(t, d){
  const p=Math.min(100,(t/(d||1))*100);
  $("p-fill").style.width=p+"%"; $("p-knob").style.left=p+"%";
  $("p-cur").textContent=mmss(t);
  $("p-seek").setAttribute("aria-valuenow", Math.round(p));
}
function sonando(){ return loaded && !au.paused; }
function pintar(){
  const s=sonando();
  $("ico-play").toggleAttribute("hidden", s); $("ico-pause").toggleAttribute("hidden", !s);
  $("p-play").setAttribute("aria-label", s?"Pausar":"Reproducir");
  avisar();
}
function pintarVol(){
  const v=au.muted?0:volumen;
  $("p-volfill").style.width=(v*100)+"%";
  $("ico-x").toggleAttribute("hidden", !(au.muted||volumen===0));
  $("p-mute").setAttribute("aria-pressed", String(au.muted));
  $("p-vol-bar").setAttribute("aria-valuenow", Math.round(v*100));
}
function alternar(){ if(!loaded){cargar(cur,true);return;} au.paused?au.play().catch(()=>{}):au.pause(); }
function siguiente(forzar){
  if(aleatorio){ let i; do{ i=Math.floor(Math.random()*TRACKS.length); }while(i===cur); cargar(i,true); }
  else if(cur<TRACKS.length-1 || forzar) cargar(cur+1,true);
  else { au.pause(); pintar(); }
}
function tocarTema(n){
  const i=TRACKS.findIndex(t=>t.n===n); if(i<0) return;
  if(i===cur && loaded) alternar(); else cargar(i,true);
}

$("p-play").addEventListener("click", alternar);
$("p-prev").addEventListener("click", ()=>{ if(au.currentTime>3){au.currentTime=0;return;} cargar(cur-1,true); });
$("p-next").addEventListener("click", ()=> siguiente(true));
$("p-shuffle").addEventListener("click", ()=>{ aleatorio=!aleatorio; $("p-shuffle").setAttribute("aria-pressed",String(aleatorio)); guardar(); });
$("p-mute").addEventListener("click", ()=>{ au.muted=!au.muted; if(!au.muted&&volumen===0){volumen=.6;au.volume=volumen;} pintarVol(); guardar(); });

au.addEventListener("play", pintar);
au.addEventListener("pause", ()=>{ pintar(); guardar(); });
au.addEventListener("ended", ()=> siguiente(false));
let ultimoGuardado=0;
au.addEventListener("timeupdate", ()=>{
  pintarTiempo(au.currentTime, au.duration||TRACKS[cur].d);
  avisar();
  if(Date.now()-ultimoGuardado>4000){ ultimoGuardado=Date.now(); guardar(); }
});
au.addEventListener("loadedmetadata", ()=>{ $("p-dur").textContent=mmss(au.duration); avisar(); });
au.addEventListener("seeked", avisar);
au.addEventListener("error", ()=>{ if(loaded){ $("p-err").hidden=false; pintar(); } });

/* barras arrastrables (posición y volumen) */
function arrastrable(el, alMover){
  const pos=ev=>{ const r=el.getBoundingClientRect(); return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); };
  el.addEventListener("pointerdown", ev=>{
    el.setPointerCapture(ev.pointerId); alMover(pos(ev));
    const mover=e=>alMover(pos(e));
    const soltar=()=>{ el.removeEventListener("pointermove",mover); el.removeEventListener("pointerup",soltar); guardar(); };
    el.addEventListener("pointermove",mover); el.addEventListener("pointerup",soltar);
  });
}
arrastrable($("p-seek"), f=>{
  if(!loaded) cargar(cur,false);
  const d=au.duration||TRACKS[cur].d; try{ au.currentTime=f*d; }catch(e){} pintarTiempo(f*d,d);
});
arrastrable($("p-vol-bar"), f=>{ volumen=f; au.volume=f; au.muted=false; pintarVol(); });
$("p-seek").addEventListener("keydown", ev=>{
  if(!loaded) return;
  if(ev.key==="ArrowRight"){ au.currentTime=Math.min(au.duration||0,au.currentTime+5); ev.preventDefault(); }
  if(ev.key==="ArrowLeft"){ au.currentTime=Math.max(0,au.currentTime-5); ev.preventDefault(); }
});
$("p-vol-bar").addEventListener("keydown", ev=>{
  const d=ev.key==="ArrowRight"?.1:ev.key==="ArrowLeft"?-.1:0; if(!d) return;
  ev.preventDefault(); volumen=Math.max(0,Math.min(1,volumen+d)); au.volume=volumen; au.muted=false; pintarVol(); guardar();
});
document.addEventListener("keydown", ev=>{
  if(ev.code==="Space" && !/^(INPUT|TEXTAREA|BUTTON|A|SELECT)$/.test(document.activeElement.tagName)){
    ev.preventDefault(); alternar();
  }
});

/* estado guardado: retoma el tema donde quedó (en pausa) */
(function retomar(){
  let s=null; try{ s=JSON.parse(localStorage.getItem("s7-player")); }catch(e){}
  if(s && Number.isInteger(s.cur)){
    volumen = typeof s.vol==="number" ? s.vol : 1; au.volume=volumen; au.muted=!!s.muted;
    aleatorio=!!s.aleatorio; $("p-shuffle").setAttribute("aria-pressed",String(aleatorio));
    if(s.t>1) cargar(s.cur,false,s.t);
    else { cur=s.cur; $("p-title").textContent=TRACKS[cur].t; $("p-dur").textContent=mmss(TRACKS[cur].d); }
  }
  pintarVol(); pintar();
})();

/* ---------- diálogo con la sección abierta ---------- */
function avisar(){
  try{
    marco.contentWindow.postMessage({s7:"estado", n:TRACKS[cur].n, sonando:sonando(), cargado:loaded,
      t:au.currentTime||0, d:au.duration||TRACKS[cur].d}, "*");
  }catch(e){}
}
const indice=n=>TRACKS.findIndex(t=>t.n===n);
addEventListener("message", ev=>{
  if(ev.source!==marco.contentWindow) return;
  const m=ev.data||{};
  if(m.s7==="hola") avisar();
  else if(m.s7==="ir") ir(m.a||"", m.q||"");
  else if(m.s7==="tema") tocarTema(+m.n);
  else if(m.s7==="alternar") alternar();
  /* lo que piden Discos y Letras a través de su audio de puente */
  else if(m.s7==="cargar"){ const i=indice(+m.n); if(i>=0 && (i!==cur || !loaded)) cargar(i, sonando()); }
  else if(m.s7==="play"){
    const i=indice(+m.n);
    if(i>=0 && (i!==cur || !loaded)) cargar(i,true); else au.play().catch(()=>{});
  }
  else if(m.s7==="pausa") au.pause();
  else if(m.s7==="buscar"){
    const t=+m.t||0;
    if(!loaded) cargar(cur,false,t); else { try{ au.currentTime=t; }catch(e){} }
  }
});
marco.addEventListener("load", avisar);

/* entrar directo a una sección (index.html#discos) */
if(location.hash) mostrar(decodeURIComponent(location.hash.slice(1)));
</script>
