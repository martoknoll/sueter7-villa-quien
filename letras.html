<style>

/* letra de muestra: sirve para ver cómo se comporta la vista sin tener
   todavía las letras reales cargadas */
const MUESTRA = `[00:03.00]Acá va el primer verso
[00:08.50]y acá el segundo, que es más largo y ocupa dos renglones si hace falta
[00:14.00]el tercero entra enseguida
[00:18.00]el cuarto
[00:23.50]y el quinto cierra la primera parte
[00:40.00]después del interludio vuelve
[00:45.50]con otro verso
[00:50.00]y otro más
[00:56.00]hasta el final`;

const DISCO = "Todo Salió Bien en la Sencilla Villa Quién";
const TRACKS = [
  {n:1, t:"Escritorio",             f:"audio/01-escritorio.mp3",             d:398},
  {n:2, t:"Confluencias",           f:"audio/02-confluencias.mp3",           d:220},
  {n:3, t:"Enero Cuervo",           f:"audio/03-enero-cuervo.mp3",           d:333},
  {n:4, t:"De Chungking a Mendoza", f:"audio/04-de-chungking-a-mendoza.mp3", d:322},
  {n:5, t:"Mapache",                f:"audio/05-mapache.mp3",                d:252},
  {n:6, t:"Almohadas",              f:"audio/06-almohadas.mp3",              d:311},
  {n:7, t:"Miedos de Transporte",   f:"audio/07-miedos-de-transporte.mp3",   d:308},
  {n:8, t:"Todo Salió Bien (Carta para un amigo)", f:"audio/08-todo-salio-bien.mp3", d:554}
];

const PAUSA_MINIMA = 10;       /* segundos entre versos para dibujar el separador de interludio */
const $ = id => document.getElementById(id);
/* adentro de la estación, el audio es el reproductor de la estación (ver puente.js) */
const au = (window.S7 && S7.audio) || $("au");
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
const mmss = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";

/* ---------- escalado de la pantalla de 1920 ---------- */
function fit(){
  const s=$("screen"), stage=s.parentElement;
  const k=Math.min(stage.parentElement.clientWidth/1920, innerHeight/1080);
  s.style.transform="scale("+k+")";
  stage.style.height=(1080*k)+"px";
}
window.addEventListener("resize", fit); fit();

/* ---------- si los iconos están en una subcarpeta, los buscamos ahí ---------- */
let reubicados=false;
document.querySelectorAll(".ic").forEach(img=>{
  img.addEventListener("error", ()=>{
    if(reubicados) return;
    reubicados=true;
    document.querySelectorAll(".ic").forEach(o=>{
      if(!o.getAttribute("src").includes("/")) o.src="iconos/"+o.getAttribute("src");
    });
  }, {once:true});
});
$("pthumb-img").addEventListener("error", ()=>{ $("pthumb-img").style.display="none"; }, {once:true});

/* =====================================================================
   PARSEO DEL LRC
   ===================================================================== */
function parsear(txt){
  const versos=[];
  let desfase = 0;                       /* [offset:] del encabezado, en ms */
  (txt||"").split(/\r?\n/).forEach(linea=>{
    const off = linea.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if(off){ desfase = (+off[1])/1000; return; }
    /* [ti:], [ar:], [al:], [length:] y demás encabezados no son versos */
    const m = linea.match(/^\s*\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]\s*(.*)$/);
    if(!m) return;
    let frac = 0;
    if(m[3]) frac = m[3].length===3 ? (+m[3])/1000 : (+m[3])/100;
    /* las líneas sin texto se guardan igual: marcan los interludios,
       y sirven para vaciar la pantalla mientras no se canta */
    versos.push({ t: (+m[1])*60 + (+m[2]) + frac, x: m[4].trim() });
  });
  versos.sort((a,b)=>a.t-b.t);
  versos.forEach(v=>{ v.t = Math.max(0, v.t + desfase); });
  /* si arranca con un marcador vacío en 0, no aporta nada */
  while(versos.length && !versos[0].x && versos[0].t < 0.05) versos.shift();
  return versos;
}

/* =====================================================================
   ESTADO
   ===================================================================== */
let cur = 0;                 /* índice del tema */
let versos = [];             /* letra del tema actual, con tiempos */
let crudo  = [];             /* la misma letra escrita, sin tiempos */
let activo = -1;             /* verso que suena */
let demo = null;             /* {t0} cuando corre la letra de muestra */
let cargado = false;

/* en demo el tiempo lo da un reloj propio, así se puede ver el efecto
   incluso sin tener el audio a mano */
const ahora = () => demo ? ((performance.now()-demo.t0)/1000) % 75 : au.currentTime;

/* =====================================================================
   LISTA DE TEMAS
   ===================================================================== */
function pintarLista(){
  const cont = $("lista-temas");
  cont.innerHTML = "";
  TRACKS.forEach((tr,i)=>{
    const b = document.createElement("button");
    b.className = "tema" + (i===cur ? " son" : "");
    b.type = "button";
    b.innerHTML = '<span class="n">'+String(tr.n).padStart(2,"0")+'</span>'+
                  '<span class="t"></span>';
    b.querySelector(".t").textContent = tr.t;
    b.addEventListener("click", ()=> cargar(i, !au.paused && cargado));
    cont.appendChild(b);
  });
}

/* =====================================================================
   LA TIRA DE LETRA
   ===================================================================== */
function pintarLetra(){
  const rollo = $("rollo");
  rollo.innerHTML = "";
  activo = -1;

  /* sin tiempos todavía: se muestra la letra escrita, que ya la tenemos */
  if(!versos.length){
    const crudo = (LETRA_CRUDA[TRACKS[cur].n] || "").trim();
    if(crudo){
      const caja = document.createElement("div");
      caja.className = "suelta";

      const sello = document.createElement("div");
      sello.className = "sello";
      sello.textContent = "Letra sin sincronizar";
      caja.appendChild(sello);

      crudo.split(/\n/).forEach(l=>{
        const d = document.createElement("div");
        if(l.trim()){ d.className = "linea"; d.textContent = l.trim(); }
        else { d.className = "espacio"; d.setAttribute("aria-hidden","true"); }
        caja.appendChild(d);
      });

      const pie = document.createElement("div");
      pie.className = "cierre";
      pie.innerHTML = 'Todavía no tiene los tiempos, así que no se resalta sola ni se '+
        'puede tocar un verso para saltar ahí. Se arregla pegando su archivo '+
        '.lrc en el bloque LRC de este HTML. '+
        '<button type="button" id="ver-demo">Ver cómo queda sincronizada</button>';
      caja.appendChild(pie);

      rollo.appendChild(caja);
      $("ver-demo").addEventListener("click", arrancarDemo);
      return;
    }

    const v = document.createElement("div");
    v.className = "vacio";
    v.innerHTML =
      '<h2>Todavía no cargamos esta letra</h2>'+
      '<p>Las letras se guardan con el momento exacto en que entra cada verso, '+
      'así se van resaltando mientras suena el tema y se puede tocar un verso '+
      'para saltar ahí.</p>'+
      '<button class="b" type="button" id="ver-demo">Ver cómo se ve</button>';
    rollo.appendChild(v);
    $("ver-demo").addEventListener("click", arrancarDemo);
    return;
  }

  let previo = null;
  versos.forEach((v,i)=>{
    if(!v.x) return;                         /* marcador de interludio: no se dibuja */
    if(previo !== null && v.t - versos[previo].t >= PAUSA_MINIMA){
      const p = document.createElement("div");
      p.className = "pausa";
      p.innerHTML = "<i></i><i></i><i></i>";
      p.setAttribute("aria-hidden","true");
      rollo.appendChild(p);
    }
    previo = i;
    const b = document.createElement("button");
    b.className = "verso";
    b.type = "button";
    b.dataset.i = i;
    b.textContent = v.x;
    b.addEventListener("click", ()=>{
      if(demo){ demo.t0 = performance.now() - v.t*1000; return; }
      if(!cargado) cargar(cur, true);
      au.currentTime = v.t;
      au.play().catch(()=>{});
    });
    rollo.appendChild(b);
  });
}

function versoActual(t){
  let k = -1;
  for(let i=0;i<versos.length;i++){ if(versos[i].t <= t + 0.12) k = i; else break; }
  return k;
}

/* el primer verso con texto después de k */
function proximoConTexto(k){
  for(let i=Math.max(0,k+1); i<versos.length; i++) if(versos[i].x) return versos[i].x;
  return "";
}

/* la vista de a dos líneas: la que suena y la que viene */
function pintarDoble(k){
  const l1 = $("l1"), txt = $("l1-txt"), l2 = $("l2");

  if(!versos.length){                       /* todavía sin tiempos */
    l1.classList.remove("muda");
    txt.textContent = crudo[0] || "";
    l2.textContent  = crudo[1] || "";
    $("l1-fill").style.width = "0%";
    return;
  }
  const v = k >= 0 ? versos[k] : null;
  if(!v || !v.x){                           /* interludio, o todavía no entró */
    l1.classList.add("muda");
    txt.textContent = v ? "· · ·" : "";
    l2.textContent  = proximoConTexto(k);
  } else {
    l1.classList.remove("muda");
    txt.textContent = v.x;
    l2.textContent  = proximoConTexto(k);
  }
}

/* el bloque amarillo se va llenando mientras dura el verso */
function rellenar(k, t){
  const f = $("l1-fill");
  if(k < 0 || !versos.length || !versos[k] || !versos[k].x){ f.style.width = "0%"; return; }
  const ini = versos[k].t;
  const fin = versos[k+1] ? versos[k+1].t : ini + 6;
  const p = Math.max(0, Math.min(1, (t - ini) / Math.max(0.3, fin - ini)));
  f.style.width = (p*100).toFixed(1) + "%";
}

function marcarRollo(k){
  const rollo = $("rollo");
  if(!rollo.querySelector(".verso")) return;
  rollo.querySelectorAll(".verso").forEach(b=>{
    const i = +b.dataset.i;
    b.classList.toggle("ahora", i === k);
    b.classList.toggle("ya", i < k);
  });
  const el = rollo.querySelector('.verso[data-i="'+k+'"]');
  if(el){
    const destino = el.offsetTop - rollo.clientHeight*0.36;
    rollo.scrollTo({ top: Math.max(0, destino), behavior: quieto ? "auto" : "smooth" });
  }
}

function seguir(forzar){
  if(!versos.length) return;
  const t = ahora();
  const k = versoActual(t);
  if(k !== activo || forzar){
    activo = k;
    pintarDoble(k);
    if($("tira").classList.contains("completa")) marcarRollo(k);
  }
  rellenar(k, t);
}

/* pasar de la vista de a dos a la letra entera y volver */
$("ver-completa").addEventListener("click", ()=>{
  const on = $("tira").classList.toggle("completa");
  $("ver-completa").textContent = on ? "De a dos líneas" : "Letra completa";
  if(on){ pintarLetra(); marcarRollo(activo); }
});

function pintarNota(){
  const n = $("nota");
  if(versos.length){
    n.innerHTML = 'Se mueve sola con el tema. '+
      '<button type="button" id="ir-completa">Ver la letra entera</button>';
    $("ir-completa").addEventListener("click", ()=> $("ver-completa").click());
  } else {
    n.innerHTML = '<b>Esta letra todavía no tiene tiempos</b>, así que no se mueve sola. '+
      'Se carga pegando su archivo .lrc en el bloque LRC de este HTML. '+
      '<button type="button" id="ir-demo">Ver cómo queda cuando los tiene</button>';
    $("ir-demo").addEventListener("click", arrancarDemo);
  }
}

/* ---------- letra de muestra ---------- */
function arrancarDemo(){
  versos = parsear(MUESTRA);
  demo = { t0: performance.now() };
  activo = -1;
  $("aviso-demo").hidden = false;
  pintarLetra();
  pintarDoble(-1);
  pintarNota();
}
$("salir-demo").addEventListener("click", ()=>{
  demo = null;
  activo = -1;
  $("aviso-demo").hidden = true;
  versos = parsear(LRC[TRACKS[cur].n]);
  pintarLetra();
  pintarDoble(-1);
  $("l1-fill").style.width = "0%";
  pintarNota();
});

/* =====================================================================
   REPRODUCTOR
   ===================================================================== */
function cargar(i, reproducir){
  cur = (i + TRACKS.length) % TRACKS.length;
  const tr = TRACKS[cur];

  au.src = tr.f; cargado = true;
  $("p-title").textContent = tr.t;
  $("p-dur").textContent = mmss(tr.d);
  $("p-cur").textContent = "0:00";
  $("p-fill").style.width = "0%"; $("p-knob").style.left = "0%";
  $("p-err").hidden = true;

  $("titulo").textContent = tr.t;
  $("titulo").style.fontSize = (tr.t.length > 28 ? 36 : tr.t.length > 18 ? 44 : 52) + "px";
  $("cab-tema").textContent = "Tema " + tr.n + " · " + tr.t;

  demo = null; $("aviso-demo").hidden = true;
  versos = parsear(LRC[tr.n]);
  crudo  = (LETRA_CRUDA[tr.n] || "").split(/\n/).map(x=>x.trim()).filter(Boolean);
  activo = -1;
  $("tira").classList.remove("completa");
  $("ver-completa").textContent = "Letra completa";
  pintarLista();
  pintarLetra();
  pintarDoble(-1);
  $("l1-fill").style.width = "0%";
  pintarNota();

  if(reproducir) au.play().catch(()=>{});
}

function pintarPlay(){
  const son = !au.paused && cargado;
  $("ico-play").hidden = son;
  $("ico-pause").hidden = !son;
  $("p-play").setAttribute("aria-label", son ? "Pausar" : "Reproducir");
}

$("p-play").addEventListener("click", ()=>{
  if(!cargado) cargar(cur, true);
  else if(au.paused) au.play().catch(()=>{});
  else au.pause();
});
$("p-prev").addEventListener("click", ()=> cargar(cur-1, !au.paused && cargado));
$("p-next").addEventListener("click", ()=> cargar(cur+1, !au.paused && cargado));

$("p-shuffle").addEventListener("click", e=>{
  const on = e.currentTarget.classList.toggle("on");
  e.currentTarget.setAttribute("aria-pressed", on ? "true" : "false");
});

$("p-seek").addEventListener("click", e=>{
  const r = e.currentTarget.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if(demo){ demo.t0 = performance.now() - p*75*1000; return; }
  if(!cargado) cargar(cur, false);
  const dur = isFinite(au.duration) ? au.duration : TRACKS[cur].d;
  au.currentTime = p * dur;
});

$("p-vol-bar").addEventListener("click", e=>{
  const r = e.currentTarget.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  au.volume = p; au.muted = false;
  $("p-volfill").style.width = (p*100) + "%";
  /* sin volumen cambia el ícono por el de mute */
  const carpeta = $("ic-vol-a").getAttribute("src").includes("/") ? "iconos/" : "";
  $("ic-vol-a").src = carpeta + (p === 0 ? "mute.png" : "vol.png");
  $("ic-vol-b").src = carpeta + (p === 0 ? "mute-glitch.png" : "vol-glitch.png");
});

au.addEventListener("play", pintarPlay);
au.addEventListener("pause", pintarPlay);
au.addEventListener("error", ()=>{ if(cargado) $("p-err").hidden = false; });
au.addEventListener("seeked", ()=> seguir(true));
au.addEventListener("timeupdate", ()=>{
  const dur = isFinite(au.duration) ? au.duration : TRACKS[cur].d;
  const p = dur ? (au.currentTime/dur)*100 : 0;
  $("p-fill").style.width = p + "%";
  $("p-knob").style.left = p + "%";
  $("p-cur").textContent = mmss(au.currentTime);
});

/* un solo bucle para seguir la letra: timeupdate no alcanza, dispara
   cada 250ms y se nota el retraso en el resalte */
function bucle(){
  if(demo || (!au.paused && cargado)) seguir();
  requestAnimationFrame(bucle);
}
/* el título del tema se achica solo si es largo */
requestAnimationFrame(bucle);


/* ---------- arranque ---------- */
const pedido = new URLSearchParams(location.search).get("tema");
/* si el tema cambia desde el reproductor de la estación, la letra lo acompaña */
window.addEventListener("s7-tema", e=>{ const i=TRACKS.findIndex(t=>t.n===e.detail); if(i>=0 && i!==cur) cargar(i,false); });
cargar(pedido ? (+pedido - 1) : 0, false);
pintarPlay();
</script>
